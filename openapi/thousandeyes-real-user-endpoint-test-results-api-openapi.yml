components:
  schemas:
    Endpoint_Test_Results_API_RealUserEndpointTestDetailResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestDetail'
        _links:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_SelfLinks'
    Endpoint_Test_Results_API_Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    Endpoint_Test_Results_API_RealUserEndpointTestPageResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestPageResult'
        startDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_StartDate'
        endDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndDate'
        _links:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_PaginationNextLink'
    Endpoint_Test_Results_API_RealUserEndpointTestResultsRequest:
      type: object
      properties:
        searchFilters:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestResultRequestFilter'
    Endpoint_Test_Results_API_EndpointTestEthernetProfile:
      type: object
      properties:
        linkSpeed:
          type: integer
          description: Ethernet profile link speed
          example: 860
          readOnly: true
    Endpoint_Test_Results_API_RealUserEndpointTestPageResult:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestPage'
      - type: object
        properties:
          agentId:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentId'
          id:
            type: string
            description: Endpoint real user test ID. Each endpoint real user test occurrence has a unique ID.
            example: 07625:1490529480:aVDViw0i
            readOnly: true
          roundId:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RoundId'
          responseTime:
            type: integer
            description: HTTP server response in milliseconds.
            example: 240
            readOnly: true
          systemMetrics:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_SystemMetrics'
    Endpoint_Test_Results_API_TracerouteHop:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_Hop'
      - type: object
        properties:
          asn:
            type: integer
            description: Unique number assigned to an organization (also referred to as service provider).
            example: 34779
            readOnly: true
          delay:
            type: integer
            description: Hop delay
            example: 5
            readOnly: true
          mpls:
            type: array
            description: Hop Multiprotocol Label Switching.
            items:
              type: string
            example:
            - L=301472,E=0,S=1,T=1
            readOnly: true
          name:
            type: string
            description: The hop name.
            example: 89-210-88-65.access.t-2.net
            readOnly: true
    Endpoint_Test_Results_API_NetworkProxy:
      type: object
      properties:
        bypass:
          type: string
          description: Proxy bypass expression.
          example: '*.local;169.254/16'
          readOnly: true
        proxy:
          type: string
          description: Proxy mode.
          example: <direct>
          readOnly: true
    Endpoint_Test_Results_API_NetworkPing:
      type: object
      properties:
        avgRtt:
          type: integer
          description: Ping average response time.
          example: 7
          readOnly: true
        maxRtt:
          type: integer
          description: Ping maximum response time.
          example: 66
          readOnly: true
        loss:
          type: number
          format: double
          description: Network loss.
          example: 1
          readOnly: true
        meanDevRtt:
          type: integer
          description: Ping mean standard deviation response time.
          example: 11
          readOnly: true
        minRtt:
          type: integer
          description: Ping minimum response time.
          example: 1
          readOnly: true
        pktsReceived:
          type: integer
          description: Ping packets received.
          example: 10
          readOnly: true
        pktsSent:
          type: integer
          description: Ping packets sent.
          example: 10
          readOnly: true
        error:
          type: string
          description: Only present when there is an error.
          example: An operation timed out.
          readOnly: true
        infoFlags:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_ErrorFlags'
    Endpoint_Test_Results_API_RealUserEndpointTest:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestBase'
      - type: object
        properties:
          pageId:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointPageId'
    Endpoint_Test_Results_API_SelfLinks:
      type: object
      description: A links object containing the self link.
      readOnly: true
      properties:
        self:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_Link'
    Endpoint_Test_Results_API_RealUserEndpointTestNetworkResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestNetworkResult'
        startDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_StartDate'
        endDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndDate'
        _links:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_PaginationNextLink'
    Endpoint_Test_Results_API_InterfaceHardwareType:
      type: string
      example: wireless
      enum:
      - unknown
      - wireless
      - ethernet
      - modem
      - virtual
      - loopback
      - other
    Endpoint_Test_Results_API_EndpointAgentId:
      type: string
      format: uuid
      description: Unique ID of endpoint agent, from `/endpoint/agents` endpoint.
      example: 861b7557-cd57-4bbb-b648-00bddf88ef49
      readOnly: true
    Endpoint_Test_Results_API_UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: invalid_token
        error_description:
          type: string
          example: Invalid access token
    Endpoint_Test_Results_API_RealUserEndpointTestResultRequestFilter:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointResultRequestFilter'
      - type: object
        properties:
          destinationIp:
            type: array
            description: Web site destination IP address.
            items:
              type: string
            example:
            - 84.255.241.1
            - 193.2.1.88
          domain:
            type: array
            description: Web site base domain visited during the session.
            items:
              type: string
            example:
            - thousandeyes.com
          trigger:
            type: array
            description: Real user test trigger.
            items:
              $ref: '#/components/schemas/Endpoint_Test_Results_API_Trigger'
            example:
            - user
          visitedSite:
            type: array
            description: Web site domain visited during the session.
            items:
              type: string
            example:
            - app.thousandeyes.com
    Endpoint_Test_Results_API_VpnTraceroute:
      allOf:
      - description: Contains parameters representing results of a trace route test performed against the target on the VPN.
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_Traceroute'
    Endpoint_Test_Results_API_RealUserEndpointTestDetail:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestBase'
      - type: object
        properties:
          browser:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointBrowser'
          coordinates:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestCoordinates'
          pages:
            type: array
            description: Web site base domain visited during the session.
            items:
              $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestPage'
          network:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_RealUserEndpointTestNetwork'
    Endpoint_Test_Results_API_PhysicalMemoryUsedBytes:
      type: object
      properties:
        min:
          type: number
          format: double
          description: The minimum sampled memory usage value recorded during the monitored period.
          example: 1.2
          readOnly: true
        max:
          type: number
          format: double
          description: The maximum sampled memory usage value recorded during the monitored period.
          example: 2.5
          readOnly: true
        mean:
          type: number
          format: double
          description: The mean (average) value of memory usage sampled over the monitored period.
          example: 1.77
          readOnly: true
        median:
          type: number
          format: double
          description: The median value of memory usage sampled over the monitored period.
          example: 1.85
          readOnly: true
        stdDev:
          type: number
          format: double
          description: The standard deviation of memory usage sampled during the monitored period.
          example: 0.25
          readOnly: true
        count:
          type: integer
          description: The total number of samples collected during the monitored period.
          example: 155
          readOnly: true
    Endpoint_Test_Results_API_PaginationNextLink:
      type: object
      description: A links object containing a related link for forward pagination.
      properties:
        next:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_Link'
    Endpoint_Test_Results_API_NicModelFilter:
      description: Filters results to NIC models that exactly match one of the provided values. Matching is case-sensitive.
      type: array
      items:
        type: string
        example: Intel(R) Wi-Fi 6 AX200 160MHz
    Endpoint_Test_Results_API_RealUserEndpointTestNetworkResult:
      type: object
      properties:
        agentId:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentId'
        date:
          type: string
          format: date-time
          description: UTC date when endpoint real user test took place (ISO date-time format).
          example: '2022-07-17T22:00:54Z'
          readOnly: true
        id:
          type: string
