openapi: 3.2.0
info:
  version: 7.0.100
  title: ThousandEyes HTTP Server Tests API
  x-provenance:
    method: harvested
    authored_by: Cisco ThousandEyes
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 27 OpenAPI 3.0 documents (26 per-area plus a unified 326-operation document) served anonymously from Cisco's DevNet CDN. api.thousandeyes.com itself 401s every path, so the contract is public while the API host is gated.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/000-v7-apis/docs/reference/
  - type: source
    url: https://developer.cisco.com/docs/thousandeyes/
  description: HTTP Server test management operations
servers:
- description: ThousandEyes API production URL
  url: https://api.thousandeyes.com/v7
tags:
- name: HTTP Server Tests
  description: HTTP Server test management operations
  x-displayName: HTTP Server Tests
paths:
  /tests/http-server:
    get:
      tags:
      - HTTP Server Tests
      summary: List HTTP Server tests
      operationId: getHttpServerTests
      description: 'Returns a list of all HTTP Server tests and saved events.


        **Note**: **Saved Events** are now called **Private Snapshots** in the user interface. This change does not affect API.'
      parameters:
      - $ref: '#/components/parameters/Tests_API_AccountGroupId'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Tests_API_HttpServerTests'
        '401':
          $ref: '#/components/responses/Tests_API_401'
        '403':
          $ref: '#/components/responses/Tests_API_403'
        '404':
          $ref: '#/components/responses/Tests_API_404'
        '429':
          $ref: '#/components/responses/Tests_API_429'
        '500':
          $ref: '#/components/responses/Tests_API_500'
        '502':
          $ref: '#/components/responses/Tests_API_502'
        default:
          $ref: '#/components/responses/Tests_API_GeneralError'
      security:
      - Tests_API_BearerAuth: []
    post:
      tags:
      - HTTP Server Tests
      summary: Create HTTP Server test
      operationId: createHttpServerTest
      description: Creates a new HTTP Server test. This method requires Account Admin permissions.
      parameters:
      - $ref: '#/components/parameters/Tests_API_AccountGroupId'
      - $ref: '#/components/parameters/Tests_API_ExpandTest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tests_API_HttpServerTestRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              $ref: '#/components/headers/Tests_API_Location'
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Tests_API_HttpServerTestResponse'
        '400':
          $ref: '#/components/responses/Tests_API_400'
        '401':
          $ref: '#/components/responses/Tests_API_401'
        '403':
          $ref: '#/components/responses/Tests_API_403'
        '404':
          $ref: '#/components/responses/Tests_API_404'
        '429':
          $ref: '#/components/responses/Tests_API_429'
        '500':
          $ref: '#/components/responses/Tests_API_500'
        '502':
          $ref: '#/components/responses/Tests_API_502'
        default:
          $ref: '#/components/responses/Tests_API_GeneralError'
      security:
      - Tests_API_BearerAuth: []
  /tests/http-server/{testId}:
    get:
      tags:
      - HTTP Server Tests
      summary: Get HTTP Server test
      operationId: getHttpServerTest
      description: Returns details for a HTTP Server test, including name, intervals, targets, alert rules and agents.
      parameters:
      - $ref: '#/components/parameters/Tests_API_TestIdPath'
      - $ref: '#/components/parameters/Tests_API_AccountGroupId'
      - $ref: '#/components/parameters/Tests_API_VersionId'
      - $ref: '#/components/parameters/Tests_API_ExpandTest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Tests_API_HttpServerTestResponse'
        '401':
          $ref: '#/components/responses/Tests_API_401'
        '403':
          $ref: '#/components/responses/Tests_API_403'
        '404':
          $ref: '#/components/responses/Tests_API_404'
        '429':
          $ref: '#/components/responses/Tests_API_429'
        '500':
          $ref: '#/components/responses/Tests_API_500'
        '502':
          $ref: '#/components/responses/Tests_API_502'
        default:
          $ref: '#/components/responses/Tests_API_GeneralError'
      security:
      - Tests_API_BearerAuth: []
    put:
      tags:
      - HTTP Server Tests
      summary: Update HTTP Server test
      operationId: updateHttpServerTest
      description: 'Updates a HTTP Server test. Shared tests have limited updating capabilities. Only account-specific configurations may be updated, namely: alert rules, alert suppression windows, labels, tags. This method requires Account Admin permissions.

        **Note**: **Saved Events** are now called **Private Snapshots** in the user interface. This change does not affect API.'
      parameters:
      - $ref: '#/components/parameters/Tests_API_TestIdPath'
      - $ref: '#/components/parameters/Tests_API_AccountGroupId'
      - $ref: '#/components/parameters/Tests_API_ExpandTest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Tests_API_HttpServerTestRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Tests_API_HttpServerTestResponse'
        '400':
          $ref: '#/components/responses/Tests_API_400'
        '401':
          $ref: '#/components/responses/Tests_API_401'
        '403':
          $ref: '#/components/responses/Tests_API_403'
        '404':
          $ref: '#/components/responses/Tests_API_404'
        '429':
          $ref: '#/components/responses/Tests_API_429'
        '500':
          $ref: '#/components/responses/Tests_API_500'
        '502':
          $ref: '#/components/responses/Tests_API_502'
        default:
          $ref: '#/components/responses/Tests_API_GeneralError'
      security:
      - Tests_API_BearerAuth: []
    delete:
      tags:
      - HTTP Server Tests
      summary: Delete HTTP Server test
      operationId: deleteHttpServerTest
      description: Deletes the specified HTTP Server test. This method requires Account Admin permissions.
      parameters:
      - $ref: '#/components/parameters/Tests_API_TestIdPath'
      - $ref: '#/components/parameters/Tests_API_AccountGroupId'
      responses:
        '204':
          $ref: '#/components/responses/Tests_API_204'
        '401':
          $ref: '#/components/responses/Tests_API_401'
        '403':
          $ref: '#/components/responses/Tests_API_403'
        '404':
          $ref: '#/components/responses/Tests_API_404'
        '429':
          $ref: '#/components/responses/Tests_API_429'
        '500':
          $ref: '#/components/responses/Tests_API_500'
        '502':
          $ref: '#/components/responses/Tests_API_502'
        default:
          $ref: '#/components/responses/Tests_API_GeneralError'
      security:
      - Tests_API_BearerAuth: []
components:
  schemas:
    Tests_API_BaseTest:
      allOf:
      - $ref: '#/components/schemas/Tests_API_UnexpandedTest'
      - type: object
        properties:
          alertRules:
            type: array
            description: Contains list of enabled alert rule objects.
            items:
              $ref: '#/components/schemas/Tests_API_AlertRule'
    Tests_API_InstantTest:
      allOf:
      - $ref: '#/components/schemas/Tests_API_UnexpandedInstantTest'
      - type: object
        properties:
          labels:
            $ref: '#/components/schemas/Tests_API_TestLabels'
          tags:
            $ref: '#/components/schemas/Tests_API_TestTags'
          sharedWithAccounts:
            $ref: '#/components/schemas/Tests_API_TestSharedAccounts'
    Tests_API_HttpServerProperties:
      allOf:
      - $ref: '#/components/schemas/Tests_API_HttpServerBaseProperties'
      - type: object
        required:
        - url
        properties:
          headers:
            $ref: '#/components/schemas/Tests_API_TestHeaders'
          downloadLimit:
            type: integer
            description: Specifies maximum number of bytes to download from the target object.
            example: 2048
          dnsOverride:
            type: string
            format: ipv4
            description: IP address to use for DNS override.
            example: 8.8.8.8
          randomizedStartTime:
            $ref: '#/components/schemas/Tests_API_TestRandomizedStartTime'
          requestMethod:
            $ref: '#/components/schemas/Tests_API_RequestMethod'
          postBody:
            type: string
            description: Enter the body for the HTTP POST request in this field. No special escaping is required. If content is provided and `requestMethod` is not specified, `requestMethod` is automatically set to `post`.
            example: '{ "example" : "value"}'
          ipv6Policy:
            $ref: '#/components/schemas/Tests_API_TestIpv6Policy'
          type:
            $ref: '#/components/schemas/Tests_API_TestHttpType'
    Tests_API_HttpServerBaseProperties:
      type: object
      properties:
        authType:
          $ref: '#/components/schemas/Tests_API_TestAuthType'
        agentInterfaces:
          $ref: '#/components/schemas/Tests_API_AgentInterfaces'
        bandwidthMeasurements:
          $ref: '#/components/schemas/Tests_API_TestBandwidthMeasurements'
        clientCertificate:
          $ref: '#/components/schemas/Tests_API_TestClientCertificate'
        contentRegex:
          type: string
          description: Content regex, this field does not require escaping.
          example: (regex)+
        customHeaders:
          $ref: '#/components/schemas/Tests_API_TestCustomHeaders'
        desiredStatusCode:
          $ref: '#/components/schemas/Tests_API_TestDesiredStatusCode'
        distributedTracing:
          $ref: '#/components/schemas/Tests_API_TestDistributedTracing'
        downloadLimit:
          type: integer
          description: Specifies maximum number of bytes to download from the target object.
          example: 2048
        dnsOverride:
          type: string
          format: ipv4
          description: IP address to use for DNS override.
          example: 8.8.8.8
        httpTargetTime:
          $ref: '#/components/schemas/Tests_API_TestHttpTargetTime'
        httpTimeLimit:
          $ref: '#/components/schemas/Tests_API_TestHttpTimeLimit'
        httpVersion:
          $ref: '#/components/schemas/Tests_API_TestHttpVersion'
        includeHeaders:
          $ref: '#/components/schemas/Tests_API_TestIncludeHeaders'
        mtuMeasurements:
          $ref: '#/components/schemas/Tests_API_TestMtuMeasurements'
        networkMeasurements:
          $ref: '#/components/schemas/Tests_API_TestNetworkMeasurements'
        numPathTraces:
          $ref: '#/components/schemas/Tests_API_TestNumPathTraces'
        oAuth:
          $ref: '#/components/schemas/Tests_API_OAuth'
        password:
          $ref: '#/components/schemas/Tests_API_TestPassword'
        pathTraceMode:
          $ref: '#/components/schemas/Tests_API_TestPathTraceMode'
        probeMode:
          $ref: '#/components/schemas/Tests_API_TestProbeMode'
        protocol:
          $ref: '#/components/schemas/Tests_API_TestProtocol'
        sslVersion:
          $ref: '#/components/schemas/Tests_API_TestSslVersion'
        sslVersionId:
          $ref: '#/components/schemas/Tests_API_TestSslVersionId'
        url:
          $ref: '#/components/schemas/Tests_API_TestUrl'
        useNtlm:
          $ref: '#/components/schemas/Tests_API_TestUseNtlm'
        userAgent:
          $ref: '#/components/schemas/Tests_API_TestUserAgent'
        username:
          $ref: '#/components/schemas/Tests_API_TestUsername'
        verifyCertificate:
          $ref: '#/components/schemas/Tests_API_TestVerifyCertificate'
        allowUnsafeLegacyRenegotiation:
          $ref: '#/components/schemas/Tests_API_TestAllowUnsafeLegacyRenegotiation'
        followRedirects:
          $ref: '#/components/schemas/Tests_API_TestFollowRedirects'
        fixedPacketRate:
          $ref: '#/components/schemas/Tests_API_TestFixedPacketRate'
        overrideAgentProxy:
          $ref: '#/components/schemas/Tests_API_TestOverrideAgentProxy'
        overrideProxyId:
          $ref: '#/components/schemas/Tests_API_TestOverrideProxyId'
        collectProxyNetworkData:
          $ref: '#/components/schemas/Tests_API_TestCollectProxyNetworkData'
        vaultCredentials:
          type: array
          description: List of credential IDs that are stored in an external vault.
          items:
            $ref: '#/components/schemas/Tests_API_TestVaultCredential'
    Tests_API_HttpServerTests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/Tests_API_UnexpandedHttpServerTest'
        _links:
          $ref: '#/components/schemas/Tests_API_SelfLinks'
    Tests_API_TestUrl:
      type: string
      description: Target for the test.
      example: www.thousandeyes.com
    Tests_API_TestAgentRequest:
      type: object
      required:
      - agentId
      properties:
        agentId:
          type: string
          description: The agent ID. Get `agentId` from `/agents` endpoint.
        sourceIpAddress:
          type: string
          description: The IP address from the `ipAddresses` field in agent details, used for interface selection. Get `ipAddresses` from the `/agents` endpoint.
      example:
        agentId: '125'
        sourceIpAddress: 1.1.1.1
    Tests_API_AgentResponse:
      allOf:
      - required:
        - agentType
        properties:
          agentType:
            $ref: '#/components/schemas/Tests_API_CloudEnterpriseAgentType'
      - $ref: '#/components/schemas/Tests_API_SimpleAgent'
    Tests_API_TestSslVersion:
      type: string
      description: Reflects the verbose SSL protocol version used by a test.
      readOnly: true
      example: Auto
    Tests_API_TestHeaders:
      type: array
      description: HTTP request headers used.
      items:
        type: string
      example:
      - 'header1: value1'
      - 'header2: value2'
    Tests_API_TestUsername:
      type: string
      description: Username for Basic/NTLM authentication.
      example: username
    Tests_API_Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    Tests_API_SensitivityLevel:
      type: string
      description: Used when `roundsViolatingMode` is set to `auto`. The default is `medium`. Higher sensitivity increases the likelihood of triggering alerts.
      enum:
      - high
      - medium
      - low
      example: medium
      readOnly: true
    Tests_API_TestDistributedTracing:
      type: boolean
      description: Adds distributed tracing headers to API requests using B3 and W3C standards.
      example: false
    Tests_API_TestHttpTargetTime:
      type: integer
      minimum: 100
      maximum: 5000
      description: Target time for HTTP server completion, specified in milliseconds.
      example: 100
    Tests_API_TestBgpMonitors:
      type: array
      description: Contains list of enabled BGP monitors.
      readOnly: true
      items:
        $ref: '#/components/schemas/Tests_API_Monitor'
    Tests_API_AlertType:
      type: string
      description: Type of alert being triggered. In multi-layered tests, this value represents the layer the alert relates to. See [Alert Details](https://developer.cisco.com/docs/thousandeyes/retrieve-alert-details/) documentation for a list of possible values
      example: http-server
      enum:
      - page-load
      - http-server
      - end-to-end-server
      - end-to-end-agent
      - voice
      - dns-server
      - dns-trace
      - dnssec
      - bgp
      - path-trace
      - ftp
      - sip-server
      - transactions
      - web-transactions
      - agent
      - network-outage
      - application-outage
      - device-device
      - device-interface
      - endpoint-network-server
      - endpoint-http-server
      - endpoint-path-trace
      - endpoint-browser-sessions-agent
      - endpoint-browser-sessions-application
      - api
      - web-transaction
      - unknown
    Tests_API_TestOverrideAgentProxy:
      type: boolean
      description: Flag indicating if a proxy other than the default should be used. To override the default proxy for agents, set to `true` and specify a value for `overrideProxyId`.
      default: false
      example: false
    Tests_API_TestCreatedBy:
      type: string
      description: User that created the test.
      example: user@user.com
      readOnly: true
    Tests_API_ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    Tests_API_NetworkProviderType:
      type: string
      description: Classification of the agent's network provider.
      enum:
      - unknown
      - isp
      - cdn
      - stub
      - cloud-provider
      - carrier
      example: isp
      readOnly: true
    Tests_API_MonitorType:
      type: string
      description: Type of monitor
      enum:
      - public
      - private
      example: public
    Tests_API_TestPathTraceMode:
      type: string
      enum:
      - classic
      - in-session
      description: Select `inSession` to perform the path trace within a TCP session.
      default: classic
      example: classic
    Tests_API_ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Tests_API_Error'
      - type: object
        properties:
          errors:
            type:
            - array
            - 'null'
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/Tests_API_ValidationErrorItem'
    Tests_API_Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type. When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
    Tests_API_CloudEnterpriseAgentType:
      type: string
      description: Type of the agent.
      enum:
      - cloud
      - enterprise-cluster
      - enterprise
      example: enterprise-cluster
      readOnly: true
    Tests_API_MonitorsRequest:
      type: object
      properties:
        monitors:
          type: array
          description: Contains list of BGP monitor IDs (get `monitorId` from `/monitors` endpoint)
          writeOnly: true
          readOnly: false
          items:
            type: string
          example:
          - '17410'
          - '5'
    Tests_API_TestUseNtlm:
      type: boolean
      description: Set to true to use NTLM, false to use Basic Authentication. Requires username and password to be set.
      example: false
    Tests_API_TestTag:
      type: object
      readOnly: true
      properties:
        id:
          type: string
          description: Unique tag ID.
          example: 5aeab5d5-0d34-4d44-a7ac-fb440185295c
          format: uuid
        key:
          type: string
          description: Tag key. For example, "Location" or "Department".
          example: Location
        value:
          type: string
          description: Tag value. For example, "San Francisco" or "Engineering".
          example: San Francisco
    Tests_API_TestLabel:
      type: object
      properties:
        labelId:
          type: string
          description: Label ID.
        name:
          type: string
          description: Name of the label.
        isBuiltin:
          type: boolean
          description: Value indicating if the label in question is BuiltIn (Account Admin, Organization Admin, Regular User).
      example:
        labelId: '961'
        name: Artem label
        isBuiltin: false
    Tests_API_TestCreatedDate:
      type: string
      format: date-time
      description: UTC created date (ISO date-time format).
      example: '2022-07-17T22:00:54Z'
      readOnly: true
    Tests_API_TestIpv6Policy:
      type: string
      enum:
      - force-ipv4
      - prefer-ipv6
      - force-ipv6
      - use-agent-policy
      description: IP version policy. Overrides the IPv6 policy configured at the agent level.
      default: use-agent-policy
      example: use-agent-policy
    Tests_API_TestMonitorsProperties:
      type: object
      properties:
        bgpMeasurements:
          $ref: '#/components/schemas/Tests_API_TestBgpMeasurements'
        usePublicBgp:
          $ref: '#/components/schemas/Tests_API_TestUsePublicBgp'
        monitors:
          $ref: '#/components/schemas/Tests_API_TestBgpMonitors'
    Tests_API_HttpServerTestRequest:
      allOf:
      - $ref: '#/components/schemas/Tests_API_UnexpandedHttpServerTest'
      - $ref: '#/components/schemas/Tests_API_TestRequest'
      - $ref: '#/components/schemas/Tests_API_MonitorsRequest'
    Tests_API_TestOverrideProxyId:
      type: string
      description: ID of the proxy to be used if the default proxy is overridden.
      example: '281474976710706'
    Tests_API_TestUsePublicBgp:
      type: boolean
      description: Indicate if all available public BGP monitors should be used, when ommited defaults to `bgpMeasurements` value.
      default: true
      example: true
    Tests_API_TestAgentsResponse:
      type: array
      description: Contains list of agents.
      items:
        $ref: '#/components/schemas/Tests_API_AgentResponse'
    Tests_API_TestFollowRedirects:
      type: boolean
      description: To disable following HTTP/301 or HTTP/302 redirect directives, set this parameter to `false`.
      default: true
      example: true
    Tests_API_TestLabels:
      type: array
      description: Labels to which the test is assigned. This field is not returned for Instant Tests.
      readOnly: true
      items:
        $ref: '#/components/schemas/Tests_API_TestLabel'
    Tests_API_TestUserAgent:
      type: string
      description: User-agent string to be provided during the test.
      example: curl
    Tests_API_Enabled:
      type: boolean
      description: Test is enabled.
      example: true
      default: true
    Tests_API_SelfLinks:
      type: object
      description: A links object containing the self link.
      readOnly: true
      properties:
        self:
          $ref: '#/components/schemas/Tests_API_Link'
    Tests_API_TestProtocol:
      type: string
      enum:
      - tcp
      - icmp
      - udp
      description: Protocol used by dependent network tests (end-to-end, path trace, PMTUD).
      default: tcp
      example: tcp
    Tests_API_UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: invalid_token
        error_description:
          type: string
          example: Invalid access token
    Tests_API_TestCollectProxyNetworkData:
      type: boolean
      description: Indicates whether network data to the proxy should be collected.
      default: false
      example: false
    Tests_API_TestRandomizedStartTime:
      type: boolean
      description: Indicates whether agents should randomize the start time in each test round.
      default: false
      example: false
    Tests_API_AlertDirection:
      type: string
      enum:
      - to-target
      - from-target
      - bidirectional
      description: Direction for applicable alert types (eg. path trace, End-to-End (Agent) etc.)
      example: to-target
    Tests_API_TestVerifyCertificate:
      type: boolean
      description: Ignore or acknowledge certificate errors. Set to false to ignore certificate errors.
      default: false
      example: false
    Tests_API_Coordinates:
      type: object
      description: Geographic coordinates for agent location.
      properties:
        latitude:
          type: number
          format: double
          description: The latitude of the agent location in decimal degrees
          example: 37.77493
          readOnly: true
        longitude:
          type: number
          format: double
          description: The longitude of the agent location in decimal degrees
          example: -122.41942
          readOnly: true
    Tests_API_TestMtuMeasurements:
      type: boolean
      description: Set `true` to measure MTU sizes on network from agents to the target.
      example: false
    Tests_API_SharedWithAccount:
      type: object
      properties:
        aid:
          type: string
          description: Account group ID.
          example: '1234'
        name:
          type: string
          description: Account group name.
          example: Account name
    Tests_API_Monitor:
      type: object
      properties:
        countryId:
          type: string
          description: Country ID
          example: GB
          readOnly: true
        monitorId:
          type: string
