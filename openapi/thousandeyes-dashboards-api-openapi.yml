          $ref: '#/components/schemas/Link'
        snapshots:
          $ref: '#/components/schemas/Link'
    ApiReportDataComponentLabelMap:
      type: object
      description: Map of group labels.
      properties:
        groupProperty:
          type: string
          description: Defines the criterion used to aggregate data points under specific group values.
          example: AGENT
        groupLabels:
          type: array
          description: List of group labels.
          items:
            $ref: '#/components/schemas/ApiReportDataComponentLabelMapEntry'
    ApiAlertListWidget:
      type: object
      description: A widget that displays a list of alerts based on specified criteria, such as alert type and time frame.
      allOf:
      - $ref: '#/components/schemas/Widget'
      - type: object
        required:
        - type
        properties:
          type:
            $ref: '#/components/schemas/AlertListWidgetType'
          alertTypes:
            uniqueItems: true
            type: array
            description: List of alert types configured in the widget, an empty list means all alert types.
            items:
              $ref: '#/components/schemas/ApiAlertListAlertType'
          limitTo:
            type: integer
            format: int32
            description: Limit the number of alerts displayed in the widget.
            example: 15
          activeWithin:
            $ref: '#/components/schemas/ActiveWithin'
          dataSource:
            $ref: '#/components/schemas/AlertListDatasource'
