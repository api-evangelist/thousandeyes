    ApiWidgetFixedYScalePrefix:
      type: string
      description: Prefix denoting the unit of measurement for the fixed Y-axis scale.
      example: Mbps
      enum:
      - Kbps
      - Mbps
      - Gbps
      - Kbitps
      - Mbitps
      - Gbitps
      - Kpps
      - Mpps
      - Gpps
    TestTableFilterType:
      type: string
      enum:
      - all
      - any
      example: all
    ApiWidgetDataPoint:
      type: object
      description: Data point of a widget.
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        numberOfDataPoints:
          type: integer
          format: int64
          description: Number of test data points aggregated into the widget data point.
          example: 23304
        value:
          $ref: '#/components/schemas/WidgetValue'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ApiDataPointGroup'
    DashboardScheduleCustomRepeatUnit:
      type: string
      enum:
      - DAY
      - WEEK
      - MONTH
      example: WEEK
    WidgetLimit:
      type: integer
      format: int32
      description: Limit configured in the widget.
      example: 10
    ApiDefaultTimespan:
      type: object
      properties:
        duration:
          type: integer
          format: int64
          description: Relative timespan in seconds.
          example: 7200
        start:
          type: string
          format: date-time
          description: UTC start date of the timespan range (ISO date-time format).
          example: '2023-05-16T10:14:28Z'
        end:
          type: string
          format: date-time
          description: UTC end date of the timespan range (ISO date-time format).
          example: '2023-05-16T11:14:28Z'
    Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    ApiTestTableData:
      type: object
      description: Data shown in a test table widget.
      properties:
        testId:
          type: string
          description: Identifier of the test.
          example: '68256'
        testName:
          type: string
          description: Name of the test.
          example: Http Test Name
        target:
          type: string
          description: Configured target of the test.
          example: www.google.com
        testType:
          type: string
          description: Type of the test.
          example: Web - HTTP Server
        alertCount:
          type: integer
          format: int64
          description: Number of active alerts of the test.
          example: 398
        isShared:
          type: boolean
          description: Set to `true` if test is shared, `false` otherwise.
        graphlets:
          type: array
          description: List of time series points for test metrics in the last 12 hours.
          items:
            $ref: '#/components/schemas/ApiTestTableGraphletsData'
    TestTableWidgetType:
      type: string
      pattern: ^Test Table$
      description: Test Table widget type,
      example: Test Table
    DashboardLayoutType:
      type: string
      description: Type of the layout.
      enum:
      - grid
      - vertical
      example: grid
    ApiAgentStatusWidget:
      type: object
      allOf:
      - $ref: '#/components/schemas/Widget'
      - type: object
        required:
        - type
        properties:
          type:
            $ref: '#/components/schemas/AgentStatusWidgetType'
          agents:
            $ref: '#/components/schemas/AgentWidgetType'
          show:
            $ref: '#/components/schemas/AgentWidgetShow'
          dataSource:
            $ref: '#/components/schemas/AgentStatusDatasource'
    DashboardLayout:
      description: Dashboard layout configuration for arranging widgets.
      type: object
      required:
      - type
      properties:
        layoutId:
          type: string
          description: Unique identifier for the layout.
          example: grid-layout-1
        type:
          $ref: '#/components/schemas/DashboardLayoutType'
        details:
          $ref: '#/components/schemas/DashboardLayoutDetails'
      example:
        layoutId: grid-layout-1
        type: grid
        details:
          widgetPositioning:
          - x: 0
            y: 0
            w: 9
            h: 5
            id: widgetId-71lbb
    AswRepeatUnit:
      type: string
      enum:
      - day
      - week
      - month
      example: week
    ApiTimeseriesWidget:
      type: object
      description: The Timeseries widget graphs data over time, with the chosen metric displayed on the vertical axis. vertical axis
      allOf:
      - $ref: '#/components/schemas/Widget'
      - $ref: '#/components/schemas/ScalableWidget'
      - $ref: '#/components/schemas/ApiTimeseriesWidgetProperties'
    DashboardScheduleOneTimeRepeatType:
      type: string
      enum:
      - NONE
      example: NONE
  parameters:
    DashboardMax:
      name: max
      in: query
      description: 'Optionally specify the maximum number of objects to retrieve. This only applies to the **Alert List** and **Test Table** Widgets.

        * The default for the **Alert List** widget is set by its limitBy configuration.

        * The default value for the **Test Table** widget is 10.'
      schema:
        type: number
      example: 10
    CardId:
      name: cardId
      required: true
      in: path
      description: An identifier for a card within the numbers widget.
      schema:
        type: string
      example: rvwgs
    AccountGroupId:
      name: aid
      in: query
      description: A unique identifier associated with your account group. You can retrieve your `AccountGroupId` from the `/account-groups` endpoint. Note that you must be assigned to the target account group. Specifying this parameter without being assigned to the target account group will result in an error response.
      required: false
      schema:
        type: string
        example: '1234'
    DashboardSort:
      name: sort
      in: query
      description: 'Optional sorting parameter with attributes listed comma-separated. This only applies to the **Alert List** and **Test Table** Widgets.

        * For the **Alert List** widget, you can sort by `alertStatus` or `startTime`. The default is `alertStatus`.

        * For the **Test Table** widget, you can sort by `alertStatus`, `testName`, or `testType`. The sequence might vary from the web application. The default sort attribute is `alertStatus`.'
      schema:
        type: string
      example: alertStatus
    DashboardOrder:
      name: order
      in: query
      description: Optional sorting order parameter that accepts either `asc` (ascending) or `desc` (descending) values. This only applies to the **Alert List** and **Test Table** Widgets.
      schema:
        $ref: '#/components/schemas/DashboardOrder'
      example: asc
    DashboardCursor:
      name: cursor
      in: query
      description: An optional pagination cursor. This parameter should not not be used directly. Instead, use the `_links` returned by the API. This feature is only available in the **Test Table** widget.
      schema:
        type: string
      example: bGFzdFJvdW5kSWQ9MTY4MTQxMDQ4MA
    ColumnId:
      name: columnId
      required: true
      in: path
      description: An identifier for a column within the multi-metric table widget.
      schema:
        type: string
      example: col123
    WidgetId:
      name: widgetId
      required: true
      in: path
      description: A Identifier for a widget.
      schema:
        type: string
      example: unpmg
    StartDateParameter:
      name: startDate
      in: query
      description: Use with the `endDate` parameter. Include the complete time (hours, minutes, and seconds) in UTC time zone, following the ISO 8601 date-time format. See the example for reference. Please note that this parameter can't be used with `window`.
      schema:
        type: string
        format: date-time
        example: '2022-07-17T22:00:54Z'
    EndDateParameter:
      name: endDate
      in: query
      description: Defaults to current time the request is made. Use with the `startDate` parameter. Include the complete time (hours, minutes, and seconds) in UTC time zone, following the ISO 8601 date-time format. See the example for reference. Please note that this parameter can't be used with `window`.
      schema:
        type: string
        format: date-time
        example: '2022-07-18T22:00:54Z'
    Window:
      name: window
      in: query
      description: 'A dynamic time interval up to the current time of the request. Specify the interval as a number followed by an optional type: `s` for seconds (default if no type is specified), `m` for minutes, `h` for hours, `d` for days, and `w` for weeks.

        For a precise date range, use `startDate` and `endDate`.'
      schema:
        type: string
        pattern: ^\d+(?:[smhdw]{1})?$
        example: 12h
    DashboardIdPath:
      name: dashboardId
      required: true
      in: path
      description: A Identifier for a dashboard which can be obtained from the `/dashboards` endpoint.
      schema:
        type: string
      example: 646f4d2ce3c99b0536c3821e
  responses:
    '400':
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            type: about:blank
            title: Request validation failed. There are invalid or missing fields
            status: 400
            detail: Your request object contains invalid fields.
            instance: /v7
            errors:
            - code: AM-5432
              field: firstName
              message: firstName cannot have fancy characters
            - code: DASH-5622
              field: password
              message: Password cannot be blank
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    '204':
      description: No content
    '404':
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: URI Resource Not Found
            status: 404
            detail: Details explaining if the 404 error is related to an invalid URI or a wrong ID
            instance: /v7
    '500':
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Internal server error
            status: 500
            detail: Optional detail about the internal error message.
            instance: /v7
    '429':
      description: Exhausted rate limit for the organization
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Insufficient permissions to query endpoint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    Location:
      schema:
        type: string
        format: uri
        example: https://api.thousandeyes.com/v7/link/to/resource/id
      description: The absolute path to created resource.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication token
