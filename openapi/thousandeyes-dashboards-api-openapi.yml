          type: string
          description: Identifier of the card.
          example: lrxxr
        cardName:
          type: string
          description: Name of the card.
          example: Card Name
        startDate:
          type: string
          format: date-time
          description: UTC start date of the data shown in the API output (ISO date-time format).
          example: '2023-05-16T10:14:28Z'
        endDate:
          type: string
          format: date-time
          description: UTC end date of the data shown in the API output (ISO date-time format).
          example: '2023-05-16T10:14:28Z'
        previousValue:
          type: number
          format: double
          description: Previous value if `compareToPreviousValue == true` in configuration.
          example: 500
        binSize:
          $ref: '#/components/schemas/BinSize'
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        numberOfDataPoints:
          type: integer
          format: int64
          description: Number of points aggregated into the data point
