    ApiStackedBarchartWidget:
      allOf:
      - $ref: '#/components/schemas/Widget'
      - type: object
        required:
        - type
        description: Displays horizontal histogram bars with multiple values, which are useful for composite metric data (such as HTTP response or fetch time) and for comparing values between multiple tests or for comparing values on a country-by-country basis. The bars can be aligned horizontally or vertically as columns.
        properties:
          type:
            $ref: '#/components/schemas/BarChartStackedWidgetType'
          axisGroupBy:
            $ref: '#/components/schemas/ApiAggregateProperty'
          sortBy:
            $ref: '#/components/schemas/WidgetSortProperty'
          sortDirection:
            $ref: '#/components/schemas/WidgetSortDirection'
          limit:
            $ref: '#/components/schemas/WidgetLimit'
          showLabels:
            type: boolean
          isHorizontalBarChart:
            type: boolean
            description: Set to `true` to display bars horizontally in the widget.
          dataSource:
            $ref: '#/components/schemas/StackedBarChartDatasource'
    Widget:
      type: object
      properties:
        id:
          type: string
          description: Identifier of the widget.
          readOnly: true
          example: '1234'
        title:
          type: string
          description: Title of the widget
          example: Widget Title
        visualMode:
          $ref: '#/components/schemas/VisualMode'
        embedUrl:
          type: string
          description: When `isEmbedded` is set to `true`, an `embedUrl` is provided.
          readOnly: true
          example: https://embed.thousandeyes.com/e/00aa:3039802d-5c76-42d2-9a93-c6e5f9d3122f
        isEmbedded:
          type: boolean
          description: Set to `true` if widget is marked as embedded; otherwise, set to `false`.
        metricGroup:
          $ref: '#/components/schemas/MetricGroup'
        direction:
          $ref: '#/components/schemas/DashboardMetricDirection'
        metric:
          $ref: '#/components/schemas/DashboardMetric'
        filters:
          $ref: '#/components/schemas/WidgetFilters'
        measure:
          $ref: '#/components/schemas/ApiWidgetMeasure'
        fixedTimespan:
          $ref: '#/components/schemas/ApiDuration'
        apiLink:
          type: string
          readOnly: true
          deprecated: true
        shouldExcludeAlertSuppressionWindows:
          type: boolean
          description: Excludes alert suppression window data if set to `true`.
        _links:
          $ref: '#/components/schemas/SelfLinks'
    NumberWidgetType:
      type: string
      pattern: ^Number$
      description: Number widget type.
      example: Number
    ApiTestTableWidget:
      type: object
      description: Displays tests and statuses with options to sort and filter. It can be set to show only certain tests, like those with specific labels or failing tests.
