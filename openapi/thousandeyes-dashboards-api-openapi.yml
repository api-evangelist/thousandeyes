    CloneDashboardRequest:
      type: object
      description: Optional values that override settings inherited from the source dashboard. Omit the request body or send an empty object (`{}`) to clone the dashboard without overrides.
      properties:
        title:
          type: string
          description: Title of the cloned dashboard. If omitted, the API generates a unique title.
          example: HTTP Server Widgets Copy
        tagIds:
          description: Dashboard tag identifiers. An empty array clears tags from the clone; omission preserves the source dashboard's tags.
          allOf:
          - $ref: '#/components/schemas/TagIds'
        description:
          type: string
          maxLength: 1000
          description: Description for the cloned dashboard.
          example: Copy of the HTTP Server Widgets dashboard
        layout:
          $ref: '#/components/schemas/DashboardLayout'
        defaultTimespan:
          $ref: '#/components/schemas/DefaultTimespan'
        isGlobalOverride:
          type: boolean
          description: If `true`, the dashboard time range overrides local widget time settings.
          example: false
        refreshRate:
          $ref: '#/components/schemas/CloneDashboardRefreshRate'
        globalFilterId:
          type: string
          description: Global filter applied to the cloned dashboard. If omitted, the source dashboard's filter is preserved when cloning within the same account group. When cloning across account groups, the filter is cleared.
          example: 65babd9bb90bf55b17c96c8d
        sharedAccountIds:
          type: array
          uniqueItems: true
          description: Account group IDs with which to share the cloned dashboard. An empty array limits sharing to current account group. Omission does not share with other account groups. The `isPrivate` setting controls visibility within the current account group. Cannot be used together with `isSharedWithAllAccountGroups=true`
          items:
            $ref: '#/components/schemas/AccountGroupId'
          example:
          - '1234'
          - '5678'
        isSharedWithAllAccountGroups:
          type: boolean
          description: When `true`, shares the cloned dashboard with all account groups available to the user. Cannot be used together with `sharedAccountIds`.
          example: false
        isPrivate:
          type: boolean
          description: When `true`, only the creator can view the cloned dashboard. Combining this property with `sharedAccountIds` or `isSharedWithAllAccountGroups=true` returns `400 Bad Request`. Defaults to `false`.
          default: false
          example: true
        isDefaultForUser:
          type: boolean
          description: When `true`, sets the cloned dashboard as the current user's default dashboard.
          example: false
        isDefaultForAccount:
          type: boolean
          description: When `true`, sets the cloned dashboard as the current account group's default dashboard.
          example: false
