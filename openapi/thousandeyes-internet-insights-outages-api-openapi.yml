      summary: Retrieve network outage
      description: Returns the details of a network outage.
      operationId: getNetworkOutage
      parameters:
      - name: outageId
        in: path
        required: true
        schema:
          type: string
          example: 694D8656960F34F76489BCE5E9BCD58EC53027462740D75F
      - $ref: '#/components/parameters/Internet_Insights_API_AccountGroupId'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Internet_Insights_API_ApiNetworkOutageDetails'
        '400':
          $ref: '#/components/responses/Internet_Insights_API_400'
        '401':
