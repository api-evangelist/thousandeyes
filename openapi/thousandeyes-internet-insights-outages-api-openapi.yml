paths:
  /internet-insights/outages/filter:
    post:
      tags:
      - Internet Insights Outages
      summary: List network and application outages
      description: 'Returns a list of network and application outages using a filter object. Advanced Filter persistance is not currently supported.


        Note: Support for pagination will be added in the future.


        ## Samples Queries with Different Filter Permutations


        ### Window

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token

        --header ''Accept-Encoding: application/gzip''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "window" : "1d"

        }''

        ```


        ### Date Range

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z"

        }''

        ```


        ### Date Range with Scope

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z",

        "outageScope": "with-affected-test"

        }''

        ```

        ### Date Range with Network

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z",

        "interfaceNetwork": ["Telianet"]

        }''

        ```


        ### Date Range with Application

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z",

        "applicationName": ["Google"]

        }''

        ```

        ### Date Range with Provider

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z",

        "providerName": ["Century Link", "Microsoft"]

        }''


        ```

        ### Date Range with Application and Scope

        ```

        curl --location --request POST ''https://api.thousandeyes.com/v7/internet-insights/outages/filter''

        --header ''Authorization: Bearer $token''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "startDate": "2022-03-01T01:30:00Z",

        "endDate" : "2022-03-01T23:30:15Z",

        "outageScope": "all",

        "applicationName": ["Google"]

        }''

        ```'
      operationId: filterOutages
      parameters:
      - $ref: '#/components/parameters/Internet_Insights_API_AccountGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Internet_Insights_API_ApiOutageFilter'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Internet_Insights_API_ApiOutagesResponse'
        '400':
          $ref: '#/components/responses/Internet_Insights_API_400'
        '401':
          $ref: '#/components/responses/Internet_Insights_API_401'
        '403':
          $ref: '#/components/responses/Internet_Insights_API_403'
        '404':
          $ref: '#/components/responses/Internet_Insights_API_404'
        '429':
          $ref: '#/components/responses/Internet_Insights_API_429'
        '500':
          $ref: '#/components/responses/Internet_Insights_API_500'
        '502':
          $ref: '#/components/responses/Internet_Insights_API_502'
        default:
          $ref: '#/components/responses/Internet_Insights_API_GeneralError'
      security:
      - Internet_Insights_API_BearerAuth: []
  /internet-insights/outages/net/{outageId}:
