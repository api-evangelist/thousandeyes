openapi: 3.2.0
info:
  version: 7.0.100
  title: ThousandEyes HTTP Server Endpoint Scheduled Test Results API
  x-provenance:
    method: harvested
    authored_by: Cisco ThousandEyes
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 27 OpenAPI 3.0 documents (26 per-area plus a unified 326-operation document) served anonymously from Cisco's DevNet CDN. api.thousandeyes.com itself 401s every path, so the contract is public while the API host is gated.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/000-v7-apis/docs/reference/
  - type: source
    url: https://developer.cisco.com/docs/thousandeyes/
servers:
- description: ThousandEyes API production URL
  url: https://api.thousandeyes.com/v7
tags:
- name: HTTP Server Endpoint Scheduled Test Results
  x-displayName: HTTP Server Endpoint Scheduled Test Results
paths:
  /endpoint/test-results/scheduled-tests/{testId}/http-server:
    get:
      tags:
      - HTTP Server Endpoint Scheduled Test Results
      summary: Retrieve HTTP server scheduled test results
      description: Returns component-level (DNS, Connect, Wait and Receive) timing for the load of an object over HTTP.
      operationId: getHttpServerScheduledTestResults
      parameters:
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_TestIdPath'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_AccountGroupId'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_Window'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_StartDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_EndDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_PaginationCursor'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_ExpandEndpointHttpServer'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestResults'
        '401':
          $ref: '#/components/responses/Endpoint_Test_Results_API_401'
        '403':
          $ref: '#/components/responses/Endpoint_Test_Results_API_403'
        '404':
          $ref: '#/components/responses/Endpoint_Test_Results_API_404'
        '429':
          $ref: '#/components/responses/Endpoint_Test_Results_API_429'
        '500':
          $ref: '#/components/responses/Endpoint_Test_Results_API_500'
        '502':
          $ref: '#/components/responses/Endpoint_Test_Results_API_502'
      security:
      - Endpoint_Test_Results_API_BearerAuth: []
  /endpoint/test-results/scheduled-tests/{testId}/http-server/filter:
    post:
      tags:
      - HTTP Server Endpoint Scheduled Test Results
      summary: Filter HTTP server result for a scheduled test
      description: Returns component-level timings for an object load over HTTP. These include DNS, connect, wait, and receive times for a single scheduled test.
      operationId: getSingleTestFilteredHttpServerScheduledTestResults
      parameters:
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_TestIdPath'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_AccountGroupId'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_Window'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_StartDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_EndDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_PaginationCursor'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_ExpandEndpointHttpServer'
      requestBody:
        description: Test result search filters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestsDataRoundsSearch'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpMultiEndpointTestResults'
        '400':
          $ref: '#/components/responses/Endpoint_Test_Results_API_400'
        '401':
          $ref: '#/components/responses/Endpoint_Test_Results_API_401'
        '403':
          $ref: '#/components/responses/Endpoint_Test_Results_API_403'
        '404':
          $ref: '#/components/responses/Endpoint_Test_Results_API_404'
        '429':
          $ref: '#/components/responses/Endpoint_Test_Results_API_429'
        '500':
          $ref: '#/components/responses/Endpoint_Test_Results_API_500'
        '502':
          $ref: '#/components/responses/Endpoint_Test_Results_API_502'
      security:
      - Endpoint_Test_Results_API_BearerAuth: []
  /endpoint/test-results/scheduled-tests/http-server/filter:
    post:
      tags:
      - HTTP Server Endpoint Scheduled Test Results
      summary: Filter HTTP server scheduled test results
      description: Returns component-level (DNS, Connect, Wait and Receive) timing for the load of an object over HTTP.
      operationId: getMultiTestFilteredHttpServerScheduledTestResults
      parameters:
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_AccountGroupId'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_Window'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_StartDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_EndDateParameter'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_PaginationCursor'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_UseAllPermittedAids'
      - $ref: '#/components/parameters/Endpoint_Test_Results_API_ExpandEndpointHttpServer'
      requestBody:
        description: Test data search filters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestsDataRoundsSearch'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpMultiEndpointTestResults'
        '400':
          $ref: '#/components/responses/Endpoint_Test_Results_API_400'
        '401':
          $ref: '#/components/responses/Endpoint_Test_Results_API_401'
        '403':
          $ref: '#/components/responses/Endpoint_Test_Results_API_403'
        '404':
          $ref: '#/components/responses/Endpoint_Test_Results_API_404'
        '429':
          $ref: '#/components/responses/Endpoint_Test_Results_API_429'
        '500':
          $ref: '#/components/responses/Endpoint_Test_Results_API_500'
        '502':
          $ref: '#/components/responses/Endpoint_Test_Results_API_502'
      security:
      - Endpoint_Test_Results_API_BearerAuth: []
components:
  schemas:
    Endpoint_Test_Results_API_UserPrincipalNameFilter:
      description: Filters results based on an array of `userPrincipalName` values.
      type: array
      items:
        $ref: '#/components/schemas/Endpoint_Test_Results_API_UserPrincipalName'
    Endpoint_Test_Results_API_EndpointSpecificAgentsSelectorConfig:
      type: object
      description: Specific agents selection object.
      readOnly: true
      properties:
        agentSelectorType:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointSpecificAgentsSelectorType'
        maxMachines:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestMaxMachines'
        agents:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestAgents'
      required:
      - agentSelectorType
    Endpoint_Test_Results_API_NetworkProxy:
      type: object
      properties:
        bypass:
          type: string
          description: Proxy bypass expression.
          example: '*.local;169.254/16'
          readOnly: true
        proxy:
          type: string
          description: Proxy mode.
          example: <direct>
          readOnly: true
    Endpoint_Test_Results_API_TestName:
      type: string
      description: Name of the test.
      example: Test name
    Endpoint_Test_Results_API_HttpEndpointTestsDataRoundsSearch:
      type: object
      properties:
        searchSort:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestsDataSearchSort'
        thresholdFilter:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestsDataThresholdFilters'
        searchFilters:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestsDataSearchFilter'
    Endpoint_Test_Results_API_CellularNetworkGen:
      description: Cellular network generation.
      type: string
      example: 2g, 3g, 4g, 5g
    Endpoint_Test_Results_API_VpnType:
      type: string
      description: Name of the VPN provider.
      enum:
      - cisco-anyconnect
      - palo-alto-globalprotect
      - ivanti-connect-secure
      - zscaler-internet-access
      - f5-big-ip
      example: cisco-anyconnect
    Endpoint_Test_Results_API_VpnProfile:
      type: object
      properties:
        vpnClientAddresses:
          type: array
          description: A list of private IP addresses assigned to the device by the VPN server.
          example:
          - 184.81.113.85
          - 13.129.91.62
          readOnly: true
          items:
            type: string
        vpnClientNetworkRange:
          type: array
          description: A list of private networks assigned to the device by the VPN server.
          readOnly: true
          items:
            type: string
            example: 9.88.37.27
        vpnGatewayAddress:
          type: string
          description: IP address of the VPN gateway.
          example: 120.98.134.7
          readOnly: true
        vpnType:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_VpnType'
    Endpoint_Test_Results_API_NicDriverVersionFilter:
      description: Filters results to NIC driver versions that exactly match one of the provided values. Matching is case-sensitive.
      type: array
      items:
        type: string
        example: 22.250.0.9
    Endpoint_Test_Results_API_TestSslVersionId:
      type: string
      description: 'SSL version options:


        * Use ''0'' for automatic selection.

        * Use ''3'' for SSLv3.

        * Use ''4'' for TLS v1.0.

        * Use ''5'' for TLS v1.1.

        * Use ''6'' for TLS v1.2.

        * Use ''7'' for TLS v1.3.

        '
      enum:
      - '0'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      default: '0'
      example: '0'
    Endpoint_Test_Results_API_StartDate:
      type: string
      format: date-time
      example: '2022-07-17T22:00:54Z'
      description: (Optional) When passing `window` or `startDate` parameter,  the client will also receive the `startDate` field indicating the UTC start date of the data's time range being retrieved  (ISO date-time format).
      readOnly: true
    Endpoint_Test_Results_API_NetworkProfile:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_NetworkInterface'
      - type: object
        description: Contains basic network connectivity parameters.
        properties:
          error:
            type: string
            description: Only present when there is an error
            example: An operation timed out.
            readOnly: true
          gateway:
            type: string
            description: Network gateway address.
            example: 10.0.0.1
            readOnly: true
          wirelessProfile:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_NetworkWirelessProfile'
          proxyProfile:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_NetworkProxyProfile'
          ethernetProfile:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestEthernetProfile'
          previousInterface:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_NetworkInterface'
    Endpoint_Test_Results_API_EndpointTestSelfLink:
      allOf:
      - description: A reference to the test.
        example:
          href: https://api.thousandeyes.com/v7/endpoint/tests/{type}/281474976710706
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_Link'
    Endpoint_Test_Results_API_HttpEndpointTestsDataThresholdFilter:
      type: object
      description: The metric is filtered based on the threshold value and operator provided.
      properties:
        name:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpThresholdFilterName'
        value:
          type: number
          description: The threshold value.
          format: double
          example: 10
        operator:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_ThresholdFilterOperator'
    Endpoint_Test_Results_API_EndpointAgentSelectorConfig:
      type: object
      description: Agents selection object based on agentSelectorType.
      readOnly: true
      oneOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAllAgentsSelectorConfig'
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointSpecificAgentsSelectorConfig'
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentLabelsSelectorConfig'
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentTagsSelectorConfig'
      discriminator:
        propertyName: agentSelectorType
        mapping:
          all-agents: '#/components/schemas/Endpoint_Test_Results_API_EndpointAllAgentsSelectorConfig'
          specific-agents: '#/components/schemas/Endpoint_Test_Results_API_EndpointSpecificAgentsSelectorConfig'
          agent-labels: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentLabelsSelectorConfig'
          agent-tags: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentTagsSelectorConfig'
      required:
      - agentSelectorType
    Endpoint_Test_Results_API_EndpointScoreNumeric:
      type: number
      format: double
      description: A fine-grained score between 0 and 100.
      example: 100
    Endpoint_Test_Results_API_EndpointAgentLabelsSelectorType:
      type: string
      example: agent-labels
      pattern: ^agent-labels$
    Endpoint_Test_Results_API_ExpandEndpointHttpServerOptions:
      type: string
      enum:
      - header
      - user-profile
      example: header
    Endpoint_Test_Results_API_TestLabel:
      type: object
      properties:
        labelId:
          type: string
          description: Label ID.
        name:
          type: string
          description: Name of the label.
        isBuiltin:
          type: boolean
          description: Value indicating if the label in question is BuiltIn (Account Admin, Organization Admin, Regular User).
      example:
        labelId: '961'
        name: Artem label
        isBuiltin: false
    Endpoint_Test_Results_API_TestIsPrioritized:
      type: boolean
      description: Indicates whether the test should be prioritized when the number of tests assigned to an agent exceeds the license limit.
      default: false
      example: false
    Endpoint_Test_Results_API_HttpEndpointTestsDataSearchSortKey:
      type: string
      enum:
      - round-id
      - response-time
      - dns-time
      - connect-time
      - ssl-time
      - wait-time
      - response-code
      - wire-size
      example: round-id
    Endpoint_Test_Results_API_EndpointAllAgentsSelectorType:
      type: string
      example: all-agents
      pattern: ^all-agents$
    Endpoint_Test_Results_API_EndpointAgentId:
      type: string
      format: uuid
      description: Unique ID of endpoint agent, from `/endpoint/agents` endpoint.
      example: 861b7557-cd57-4bbb-b648-00bddf88ef49
      readOnly: true
    Endpoint_Test_Results_API_HttpEndpointTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_HttpEndpointTestResult'
        totalHits:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TotalHits'
        test:
          description: The scheduled test configuration. Omitted when the user lacks the `View endpoint experience tests` permission.
          allOf:
          - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointHttpServerTest'
        startDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_StartDate'
        endDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndDate'
        _links:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_PaginationNextAndSelfLink'
    Endpoint_Test_Results_API_PhysicalMemoryUsedBytes:
      type: object
      properties:
        min:
          type: number
          format: double
          description: The minimum sampled memory usage value recorded during the monitored period.
          example: 1.2
          readOnly: true
        max:
          type: number
          format: double
          description: The maximum sampled memory usage value recorded during the monitored period.
          example: 2.5
          readOnly: true
        mean:
          type: number
          format: double
          description: The mean (average) value of memory usage sampled over the monitored period.
          example: 1.77
          readOnly: true
        median:
          type: number
          format: double
          description: The median value of memory usage sampled over the monitored period.
          example: 1.85
          readOnly: true
        stdDev:
          type: number
          format: double
          description: The standard deviation of memory usage sampled during the monitored period.
          example: 0.25
          readOnly: true
        count:
          type: integer
          description: The total number of samples collected during the monitored period.
          example: 155
          readOnly: true
    Endpoint_Test_Results_API_TestHttpTargetTime:
      type: integer
      minimum: 100
      maximum: 5000
      description: Target time for HTTP server completion, specified in milliseconds.
      example: 100
    Endpoint_Test_Results_API_TestFollowRedirects:
      type: boolean
      description: To disable following HTTP/301 or HTTP/302 redirect directives, set this parameter to `false`.
      default: true
      example: true
    Endpoint_Test_Results_API_EndpointHttpServerTest:
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTest'
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointHttpServerBaseTest'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointHttpServerType'
          followRedirects:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestFollowRedirects'
          httpTargetTime:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestHttpTargetTime'
          httpVersion:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestHttpVersion'
          isPrioritized:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestIsPrioritized'
          interval:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestInterval'
          sslVersion:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestSslVersion'
          useNtlm:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_TestUseNtlm'
    Endpoint_Test_Results_API_HttpThresholdFilterName:
      type: string
      description: Metric on which the threshold filter is applied.
      enum:
      - response-time
      - dns-time
      - connect-time
      - throughput
      - ssl-time
      - wait-time
      - application-score
      example: response-time
    Endpoint_Test_Results_API_TestInterval:
      type: integer
      enum:
      - 60
      - 120
      - 300
      - 600
      - 900
      - 1800
      - 3600
      description: Interval between test runs in seconds.
      default: 60
      example: 60
    Endpoint_Test_Results_API_EndpointAgentLabelsSelectorConfig:
      type: object
      description: Agent labels selection object.
      readOnly: true
      deprecated: true
      properties:
        agentSelectorType:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentLabelsSelectorType'
        maxMachines:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestMaxMachines'
        endpointAgentLabels:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentLabels'
        tagIds:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TagIds'
      required:
      - agentSelectorType
    Endpoint_Test_Results_API_NetworkProxyProfile:
      type: object
      properties:
        method:
          type: string
          description: Proxy profile method.
          example: System
          readOnly: true
        proxies:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint_Test_Results_API_NetworkProxy'
    Endpoint_Test_Results_API_SortOrder:
      type: string
      example: desc
      description: Parameter indicates the ascending/descending  order of the sorting, using either the asc or desc values.
      enum:
      - asc
      - desc
    Endpoint_Test_Results_API_Platform:
      description: OS platform types. Platform "linux" was recently renamed to "roomos".
      type: string
      enum:
      - windows
      - roomos
      - phoneos
      - elux
      - cisco-wireless
      - cisco-wireless-cloud
      - linux
      - mac
      - android
      - unknown
      example: mac
    Endpoint_Test_Results_API_EndpointTestAgents:
      type: array
      description: List of endpoint agent IDs (obtained from `/endpoint/agents` endpoint). Required when `agentSelectorType` is set to `specific-agent`.
      items:
        type: string
        format: uuid
      example:
      - 0a3b9998-dc3a-4ff2-b50d-ac4a7cd986e1
      - 66eec0f1-72b4-4755-aa83-3aed61d17f3c
    Endpoint_Test_Results_API_ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    Endpoint_Test_Results_API_CpuUtilization:
      type: object
      properties:
        min:
          type: number
          format: double
          description: The minimum sampled usage value recorded during the monitored period.
          example: 0.22
          minimum: 0
          maximum: 1
          readOnly: true
        max:
          type: number
          format: double
          description: The maximum sampled usage value recorded during the monitored period.
          example: 0.75
          minimum: 0
          maximum: 1
          readOnly: true
        mean:
          type: number
          format: double
          description: The mean (average) sampled usage value recorded during the monitored period.
          example: 0.55
          minimum: 0
          maximum: 1
          readOnly: true
        median:
          type: number
          format: double
          description: The median sampled usage value recorded during the monitored period.
          example: 0.61
          minimum: 0
          maximum: 1
          readOnly: true
        stdDev:
          type: number
          format: double
          description: The standard deviation of sampled usage values recorded during the monitored period.
          example: 0.01
          minimum: 0
          maximum: 1
          readOnly: true
        count:
          type: integer
          description: The total number of samples collected during the monitored period.
          example: 150
          readOnly: true
    Endpoint_Test_Results_API_EndpointHttpDataPointScore:
      type: object
      properties:
        applicationScore:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointScoreNumeric'
        quality:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_ApplicationScoreQuality'
    Endpoint_Test_Results_API_ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Endpoint_Test_Results_API_Error'
      - type: object
        properties:
          errors:
            type:
            - array
            - 'null'
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/Endpoint_Test_Results_API_ValidationErrorItem'
    Endpoint_Test_Results_API_EndpointTest:
      type: object
      required:
      - type
      properties:
        aid:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_AccountGroupId'
        _links:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestLinks'
        agentSelectorConfig:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointAgentSelectorConfig'
        createdDate:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestCreatedDate'
        isPrioritized:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestIsPrioritized'
        interval:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestInterval'
        isEnabled:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestIsEnabled'
        isSavedEvent:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestIsSavedEvent'
        hasPathTraceInSession:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestHasPathTraceInSession'
        labels:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestLabels'
        modifiedDate:
          type: string
          format: date-time
          description: UTC last modification date (ISO date-time format).
          readOnly: true
          example: '2022-07-17T22:00:54Z'
        networkMeasurements:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestNetworkMeasurements'
        protocol:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestProtocol'
        ipVersion:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointIpVersionOut'
        server:
          type: string
          description: Target domain name or IP address.
          example: www.example.com
        testId:
          type: string
          description: Each test is assigned a unique ID to access test data from other endpoints.
          readOnly: true
          example: '281474976710706'
        testName:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestName'
        type:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointScheduledTestType'
        tcpProbeMode:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_TestProbeModeResponse'
        port:
          $ref: '#/components/schemas/Endpoint_Test_Results_API_EndpointTestPort'
    Endpoint_Test_Results_API_TestIsSavedEvent:
      type: boolean
      description: 'Indicates if the test is a saved event.


        **Note**: **Saved Events** are now called **Private Snapshots** in the user interface. This change does not affect API.

        '
      example: false
      readOnly: true
    Endpoint_Test_Results_API_RoundId:
      type: integer
      description: Epoch time (seconds) indicating the start time of the round.
      example: 1384309800
      readOnly: true
