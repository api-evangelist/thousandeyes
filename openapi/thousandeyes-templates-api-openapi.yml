      type: string
      enum:
      - ANY_AGENT
      - SPECIFIC_AGENTS
      - LIST_OF_LABELS
      example: ANY_AGENT
    BrowserTestBaseTemplate:
      type: object
      properties:
        url:
          description: The URL that the test will target.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        blockDomains:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        allowMicAndCamera:
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        allowGeolocation:
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        pageLoadingStrategy:
          description: "The page loading strategy the browser should use when loading the target webpage.\n- `normal`: Wait for the entire page to load, meaning that HTML content and all resources have been downloaded and parsed before moving to the next action in the transaction test script. \n- `eager`: Wait for the `DOMContentLoaded` event, meaning that HTML content is downloaded and parsed, and the document readiness state is “interactive” before moving to the next action in the test script. \n- `none`: Wait only for HTML content to download. Once the HTML is downloaded, the test proceeds to the next action in the transaction test script. (Default is `normal`).\n"
          anyOf:
          - $ref: '#/components/schemas/PageLoadStrategyTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        subinterval:
          description: Subinterval for round-robin testing (in seconds). Must be less than or equal to interval and must evenly divide interval. Defaults to null, which disables round-robin.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
    AlertRuleConfigurationTemplate:
      type: object
      description: Alert Rule configuration. See [ThousandEyes v6 API spec](https://developer.cisco.com/docs/thousandeyes/v6/metadata/#alert-rule-metadata) for schema details.
      externalDocs:
        url: https://developer.cisco.com/docs/thousandeyes/v6/metadata/#alert-rule-metadata
      required:
      - ruleName
      - alertType
      - expression
      - roundsViolatingRequired
      - roundsViolatingOutOf
      properties:
        ruleName:
          $ref: '#/components/schemas/StringTemplate'
          description: The name of the alert rule.
        alertType:
          description: The type of the alert rule.
          anyOf:
          - $ref: '#/components/schemas/AlertRuleTypeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        expression:
          description: The alert rule expression. Must be valid JSON. See [V6 API](https://developer.cisco.com/docs/thousandeyes/v6/metadata/#expressions) documentation for examples.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
          example: ((totalTime >= 500 ms) && (responseTime >= 500 ms))
        roundsViolatingRequired:
          description: Specifies the numerator (X value) of the "X of Y times" condition in an alert rule.
          title: RoundsViolatingRequired
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        roundsViolatingOutOf:
          description: Specifies the divisor (Y value) of the "X of Y times" condition in an alert rule.
          title: RoundsViolatingOutOf
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        severity:
          description: The severity that will be assigned when an alert is generated by this alert rule.
          anyOf:
          - $ref: '#/components/schemas/AlertRuleSeverityTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        testIds:
          description: The tests that the alert rule will be assigned to identified by the test ID.
          title: TestIds
          anyOf:
          - type: array
            items:
              type: number
              example: 43289
          - $ref: '#/components/schemas/HandlebarsExpression'
        minimumSources:
          description: The minimum number of agents that must meet the specified criteria in order to trigger an alert.
          type: number
          example: 1
    VoiceTestTypeTemplate:
