    EndpointTestConfigTemplate:
      description: "Configuration settings for a ThousandEyes Endpoint test. All test fields can be templated with Handlebars \nexpression unless otherwise noted.\n"
      required:
      - name
      - testCategory
      - testType
      - genericConfig
      - machineConfig
      - networkConfig
      type: object
      properties:
        testName:
          description: The name of the test.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        description:
          description: The description of the test.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        testType:
          description: 'The type of Endpoint scheduled test.


            Possible values are:


            - `Network` - endpoint network test

            - `Http` - endpoint http test

            '
          anyOf:
          - $ref: '#/components/schemas/EndpointTestTypeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        testCategory:
          $ref: '#/components/schemas/EndpointTestCategoryTemplate'
