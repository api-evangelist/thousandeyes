            items:
              type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        metricIds:
          description: Dashboard metric associated with the filter property.
          anyOf:
          - type: array
            uniqueItems: true
            example:
            - WEB_PAGE_LOAD_COMPLETION_RATE
            - WEB_TTFB
            - WEB_AVAILABILITY
            items:
              type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
      required:
      - filterId
      - values
      - metricIds
    EndpointHttpTestConfigTemplate:
      description: HTTP test settings.
      required:
      - httpTimeLimit
      - sslVersion
      - targetFetchTime
      - targetResponseTime
      - url
      - verifyCertHostname
      type: object
      properties:
        url:
          description: URL to target for the test.
          anyOf:
          - type: string
            example: https://meet.google.com
          - $ref: '#/components/schemas/HandlebarsExpression'
        targetResponseTime:
          description: Target response time in milliseconds.
          anyOf:
          - type: integer
            format: int64
          - $ref: '#/components/schemas/HandlebarsExpression'
        targetFetchTime:
          description: Target fetch time in milliseconds.
          anyOf:
          - type: integer
            format: int64
          - $ref: '#/components/schemas/HandlebarsExpression'
        headers:
          description: Headers to be used in the HTTP request.
          anyOf:
          - maxLength: 1024
            type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        verifyCertHostname:
          description: Flag indicating if we are to verify the certificate.
          anyOf:
          - type: boolean
          - $ref: '#/components/schemas/HandlebarsExpression'
        authType:
          anyOf:
          - $ref: '#/components/schemas/EndpointAuthTypeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        bytesToDownload:
          description: Maximum number of bytes to download on a request. If not present it means no limit.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        httpTimeLimit:
          description: Maximum amount of time in milliseconds the HTTP Server test will run.
          anyOf:
          - maximum: 60000
            minimum: 5000
            type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        username:
          description: Username if auth enabled.
          anyOf:
          - maximum: 255
            type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        password:
          description: Password if auth enabled.
          anyOf:
          - maximum: 255
            type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        postBody:
          description: Request body to be used with the POST request.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        contentRegex:
          description: Regular expression used to validate the received content. Must conform with the POSIX Extended Regular Expression Syntax.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        sslVersion:
          description: "SSL Version to be used: \n- `0` - Auto\n- `3` - SSLv3\n- `4` - TLSv1.0\n- `5` - TLSv1.1\n- `6` - TLSv1.2\n"
          anyOf:
          - maximum: 6
            minimum: 0
            type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        expectedResponseCode:
          description: Expected HTTP response code. If not present 2xx or 3xx are expected.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        targetIpOverride:
          description: 'If set to a valid IP address, this is where the request will

            be sent regardless of what the agent''s DNS resolver says.

            '
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        clientCert:
          description: Client PEM certificate used during the request.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        userAgent:
          description: The user-agent string to be used by the request. It can be any user-agent string. If not provided, the default implementation user-agent is used.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        maxRedirects:
          description: Maximum allowed redirects.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        proxyId:
          description: Proxy used by the agent to execute the test.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
        proxyDirect:
          description: Indicates if a direct proxy should be used when proxyId is not set.
          anyOf:
          - type: boolean
          - $ref: '#/components/schemas/HandlebarsExpression'
    EndpointTestCategoryOptionsTemplate:
      type: string
      enum:
      - SCHEDULED_TEST
      - DYNAMIC_APP_TEST
      example: SCHEDULED_TEST
    EndpointTestIntervalTemplate:
      description: How often the test will run, in seconds.
      type: integer
      enum:
      - 60
      - 120
      - 300
      - 600
      - 900
      - 1800
      - 3600
      example: 60
    ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          errors:
            type:
            - array
            - 'null'
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/ValidationErrorItem'
    TestBaseTemplate:
      type: object
      required:
      - testName
      - type
      - agents
      properties:
        type:
          $ref: '#/components/schemas/TestTypeTemplate'
        testName:
          description: The name of the test, must be unique.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        agents:
          description: The agents to assign to the test identified by `agentId`.
          title: Agents
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/AgentAssignmentTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        groups:
          description: 'The Labels to assign to the test.


            **Deprecation notice:** Labels (`groups`) are based on the V6 API, which is deprecated.

            Use `tagIds` instead for V7 API support. Do not use `groups` and `tagIds` together on the same test.

            '
          deprecated: true
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/LabelAssignmentTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        tagIds:
          description: 'The Tags to assign to the test, identified by tag ID. Typically set using

            Handlebars references to tags defined in the template. Tags are the recommended

            replacement for labels (`groups`) and provide full V7 API support.

            '
          anyOf:
          - $ref: '#/components/schemas/TagIdListTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
          example:
          - '{{tags.webHealthDashTag.id}}'
          - '{{tags.templateTag.id}}'
        description:
          description: Description of the test.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
    EndpointNetworkTestConfigTemplate:
      description: Network test settings.
      required:
      - flagPing
      - flagTraceroute
      - ipVersion
      - networkProtocol
      - pathtraceInSession
      - tcpConnect
      - tcpProbeMode
      type: object
      properties:
        flagPing:
          anyOf:
          - type: boolean
            description: Indicates if the test should run ping.
            example: true
          - $ref: '#/components/schemas/HandlebarsExpression'
        flagTraceroute:
          anyOf:
          - type: boolean
            description: Indicates if the test should run traceroute.
            example: true
          - $ref: '#/components/schemas/HandlebarsExpression'
        ipVersion:
          description: IP version the test should use for network tests.
          anyOf:
          - $ref: '#/components/schemas/EndpointIpVersionTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        networkProtocol:
          $ref: '#/components/schemas/EndpointTestConfigProtocolTemplate'
        pathtraceInSession:
          type: boolean
          description: Used in TCP mode only.
        tcpProbeMode:
          $ref: '#/components/schemas/EndpointTcpProbeModeTemplate'
        tcpConnect:
          type: boolean
          description: Indicates whether to use TCP Connect when running the ICMP test.
          default: false
          example: false
    AgentToAgentTestDirectionTemplate:
      description: Direction of the test (affects how results are shown). Defaults to `TO_TARGET`.
      type: string
      default: TO_TARGET
      example: TO_TARGET
      enum:
      - TO_TARGET
      - FROM_TARGET
      - BIDIRECTIONAL
    Template:
      title: Template
      required:
      - name
      description: The template to create or update.
      type: object
      properties:
        name:
          type: string
          description: The name of the template.
          example: My Template
        description:
          type: string
          description: Text that describes the template.
          example: A description of My Template
        icon:
          $ref: '#/components/schemas/TemplateIcon'
        isBuiltIn:
          type: boolean
          description: Indicates whether the template is a built-in template. This field is read-only for normal users.
          example: false
        schemaVersion:
          $ref: '#/components/schemas/SchemaVersionConfig'
        certificationLevel:
          $ref: '#/components/schemas/CertificationLevel'
          description: 'The certification level of the Template. Normal users may only create `user` templates.

            '
          example: user
        userInputs:
          description: 'A map of <key, UserInput>. User Inputs are values that the user must fill in order for

            the Template to deploy. User Inputs are like variables that can be used for dynamically setting just

            about any field in the Template, including fields for Tests, Labels, Dashboards, and most other template assets.

            User Inputs are referenced using Handlebars template substitution notation. For example:


            `"testName": "{{userInputs.targetDomain}} - HTTP"`


            The [Handlebars Syntax](https://handlebarsjs.com/guide/builtin-helpers.html) also supports basic logic operations

            and iterators that allow creating powerful and flexible templates.

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserInput'
          example:
            targetDomain:
              name: Target Domain
              description: Name of target domain that will be used for configuring tests in this template.
              type: string
            region:
              name: Cloud Region
              description: The available cloud regions to target.
              type: string
              allowedValues:
              - name: West
                value: us-west-1
              - name: East
                value: us-east-2
            agents:
              name: Source Agents
              description: The agents that will be used by the tests in this template.
              type: agents
        groupings:
          uniqueItems: true
          type: array
          description: An ordered list of groupings that organize template objects, such as user inputs or tests.
          example:
          - name: personalize
            title: Personalize your dashboard
            description: Allow you to personalize your dashboard
            type: user-input
            items:
            - dashboardTitle
            - dashboardDescription
            - dashboardFilterTitle
          - name: dns-test-group
            title: DNS Tests
            description: Grouped by DNS test type
            type: test
            items:
            - dnsTest-microsoft365
            - dnsTest-sharepoint
            - dnsTest-microsoftlogin
            - dnsTest-onedrive
            - dnsTest-outlook
          items:
            $ref: '#/components/schemas/TemplateGrouping'
        labels:
          type: object
          description: 'A map of <name, Label> objects. These are ThousandEyes Labels that will be created when the template is deployed.


            **Deprecation notice:** Labels are based on the V6 API, which is deprecated and has no V7 equivalent.

            Use `tags` instead, which provide enhanced functionality with full V7 API support.

            Do not use `labels` and `tags` together in the same template; prefer `tags` for all new templates.

            '
          deprecated: true
          additionalProperties:
            $ref: '#/components/schemas/LabelConfigurationTemplate'
          example:
            myLabel:
              name: My Label
              tests:
              - testId: 123
          externalDocs:
            url: https://developer.cisco.com/docs/thousandeyes/v6/update-a-label
        tests:
          type: object
          description: 'A map of <name, TestConfiguration> objects. These are the ThousandEyes CEA/Synthetic tests that will be created when the template is deployed.

            '
          additionalProperties:
            $ref: '#/components/schemas/TestConfigurationTemplate'
          example:
            httpServerTest:
              testName: '{{name}} - HTTP Server'
              type: http-server
              tagIds:
              - '{{tags.webHealthDashTag.id}}'
              - '{{tags.templateTag.id}}'
              interval: '{{userInputs.interval}}'
              url: https://{{userInputs.domain}}
              agents: '{{userInputs.agents}}'
            networkTest:
              testName: '{{name}} - Network'
              type: agent-to-server
              server: '{{userInputs.domain}}'
              protocol: TCP
              port: '{{userInputs.port}}'
              tagIds:
              - '{{tags.webHealthDashTag.id}}'
              - '{{tags.templateTag.id}}'
              interval: '{{userInputs.interval}}'
              url: https://{{userInputs.domain}}
              agents: '{{userInputs.agents}}'
            dnsTest:
              testName: '{{name}} - DNS'
              type: dns-server
              domain: '{{userInputs.domain}} A'
              tagIds:
              - '{{tags.webHealthDashTag.id}}'
              - '{{tags.templateTag.id}}'
              interval: '{{userInputs.interval}}'
              dnsServers: '{{userInputs.dnsServers}}'
              agents: '{{userInputs.agents}}'
        endpointTests:
          type: object
          description: 'A map of <name, EndpointTestConfiguration> objects. These are the Endpoint tests that will be created when the template is deployed. Field values support Handlebars template substitution.

            '
          additionalProperties:
            $ref: '#/components/schemas/EndpointTestConfigTemplate'
          example:
            endpointTests:
              scheduledHttpTest:
                name: Scheduled HTTP Test
                testType: Http
                testCategory: SCHEDULED_TEST
                genericConfig:
                  interval: 3600
                networkConfig:
                  flagPing: true
                httpConfig:
                  url: https://{{userInputs.tenantName}}-my.sharepoint.com
                machineConfig:
                  monitoringSettingsType: ANY_AGENT
                  agentIds: '{{userInputs.endpointAgents}}'
        tags:
          type: object
          description: 'A map of <name, TagConfiguration> objects. These are ThousandEyes Tags that will be created when the template is deployed.

            Tags use a key/value model and can be assigned to tests, endpoint tests, connected devices tests, and dashboards.

            Tag IDs can be referenced in other template assets using Handlebars notation,

            e.g., `"tagIds": ["{{tags.myTag.id}}"]`.

            '
          additionalProperties:
            $ref: '#/components/schemas/TagConfigurationTemplate'
          example:
            webHealthDashTag:
              key: Health Overview Dashboard
              value: Health Overview Dashboard
              objectType: test
              accessType: all
            templateTag:
              key: '{{name}}'
              value: '{{name}}'
              objectType: test
              accessType: all
        alertRules:
          type: object
          description: 'A map of <key, AlertRuleConfigurationTemplate> objects. These are the set of Alert Rules that will be created when the template is deployed.

            '
          additionalProperties:
            $ref: '#/components/schemas/AlertRuleConfigurationTemplate'
            description: 'An Alert Rule object. Values can be templated with Handlebars notation. As such, the Alert Rule object is defined here as

              a set of key/value pairs. See external docs for schema details.

              '
          example:
            httpAlert:
              alertType: HTTP Server
              ruleName: '{{userInputs.tenantName}} - Alert Rule'
              expression: ((totalTime >= 500 ms) && (responseTime >= 500 ms))
              roundsViolatingRequired: 1
              roundsViolatingOutOf: 1
              testIds:
              - '{{tests.pageLoadTest.testId}}'
        dashboards:
          description: 'A map of <key, DashboardConfiguration> objects. These are the set of dashboards that will be created when the template is deployed. Dashboard fields support Handlebars notation.

            '
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DashboardConfigurationTemplate'
          example:
            myDashboard:
              title: My Dashboard
              widgets:
              - filters:
                  Test Labels: '[{{labels.templateLabel.groupId}}]'
                type: 'Bar Chart: Stacked'
                title: 'A Bar Chart: Stacked widget'
                metricGroup: Web - HTTP Server
                measure:
                  type: Median
                metric: Response Time
                axisGroupBy: Continents
                dataSource: Cloud & Enterprise Agents
        dashboardFilters:
          type: object
          description: A map of <key, DashboardFilter> objects. These will be the dashboard filters created when the template is deployed.
          additionalProperties:
            $ref: '#/components/schemas/DashboardFilterConfigurationTemplate'
          example:
            netHealthDashboardFilter:
              name: '{{userInputs.dashboardFilterTitle}}'
              context:
              - dataSourceId: VIRTUAL_AGENT
                filters:
                - filterId: TEST_LABEL
                  metricIds:
                  - NET_LOSS
                  - NET_LATENCY
                  - NET_JITTER
                  values:
                  - '{{labels.testLabel.groupId}}'
        deploymentStrategy:
          description: "A map of <assetKey, DeploymentStrategy> values. The `deploymentStrategy` field defines how the system behaves when an asset (test, label, tag, dashboard) defined in the template already exists.\nThe `assetKey` identifies the asset that the deployment strategy will apply to.\nFor tests, the system uses the test type and name to determine if a test already exists. For example, if a template contains an http-server test named `Test123` and an http-server test with the same name already exists, the system assumes that this test already exists. If the test had a different type (for example, page-load), then the system would not consider the test to already exist because the types are different.\nFor Labels and Dashboards, the system uses only the name. For Tags, the unique key is determined by the combination of `key`, `value`, and `objectType`.\nAlert Rules do not currently support `deploymentStrategy`.\nBelow are the possible deployment strategies and their behaviors:\n  * `create` - The system will always attempt to create the asset. If an asset of the same name and type already exists, the system will generate an error. This behavior ensures that each asset created from a template is unique. This is the default behavior.\n  * `update` - If an asset of the same type and name already exists, the existing asset is used instead of creating a new asset. If the configuration of the asset in the template is different from the existing one, the latest configuration is applied.\n  * `ignore` - If an asset of the same type and name already exists, the existing asset is used instead of creating a new asset. If the configuration of the asset in the template is different from the existing one, the configuration of the existing asset is used and the configuration in the template is ignored.\nThe `update` and `ignore` strategies essentially allow assets to be shared across templates. For example, the built-in \"Custom Web Page\", \"Custom Web Server\", and \"Custom Device\" templates all contain a Dashboard asset called \"Health Overview\". It's `deploymentStrategy` is set to `ignore`, which means that the first deployment of a template such as the \"Custom Web Page\" template creates the \"Health Overview\" dashboard. Subsequent deployments of the \"Custom Web Page\" template do not attempt to recreate the \"Health Overview\" dashboard. Instead, the existing dashboard is reused.\nNote: Assets that were not created using a template are not included when the system searches for existing assets; they are not used with `update` or `ignore`.\n"
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DeploymentStrategy'
          example:
            testVoiceLabel: update
            testVideoLabel: update
            testLabel: update
            webHealthDashTag: update
            templateTag: update
            dnsTest: ignore
            webexDashboard: ignore
            serverTest: create
        resourceInclusion:
          description: "A map of `<assetKey, ResourceInclusion>` pairs. The `resourceInclusion` field specifies whether an asset (such as a test, endpoint test, label, tag, dashboard, or alert rule) should be included in a deployment.\nThe `assetKey` identifies the specific asset to which the inclusion rule applies.\nPossible resource inclusion values for each asset:\n  * `included` - The system will always create the asset.\n  * `skipped` - The system will not create the asset.\nIf an `assetKey` is not present in the `resourceInclusion` map, it defaults to `included`.\n**Note**: The deployment payload can override the `resourceInclusion` value defined in a template.\n"
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ResourceInclusion'
          example:
            testLabel: skipped
            dnsTest: skipped
            webexDashboard: included
        modules:
          uniqueItems: true
          type: array
          description: ThousandEyes modules this template belongs to. Regular users can only set this to `default`.
          example:
          - default
          items:
            $ref: '#/components/schemas/TemplateModule'
    UserInputType:
      type: string
      description: 'The type of user input. This defines the value the user can provide as well as the UI component displayed when redering User Inputs.

        The type is used to validate the user provided value when deploying a template.

        - `string`: User input expects a string value; UI will be rendered as a text box.

        - `number`: User input expects a numeric value; UI will be rendered as a text box.

        - `boolean`: User input expects a boolean value; UI will be rendered as a check box.

        - `string[]`: User input expects an array of string values; UI will be rendered as drop down.

        - `number[]`: User input expects an array of numeric values; UI will be rendered as drop down.

        - `boolean[]`: User input expects an array of boolean values; UI will be rendered as drop down.

        - `agents`: User input expects an array of `agentId`s; UI will be rendered as an Agent Selector (CEA) drop down.

        - `bgpPrefix`: User input expects a BGP prefix value; UI will be rendered as a text box with validation for correct BGP prefix format.

        - `tests`: User input expects an array of `testId`s; UI will be rendered as a Test Selector (CEA) drop down.

        - `any`: For any other user inputs that don''t belong to the types listed above. These will be determined based on usage in template.

        '
      example: string
      enum:
      - string
      - number
      - boolean
      - string[]
      - number[]
      - boolean[]
      - agents
      - bgpPrefix
      - tests
      - any
    LabelAssignmentTemplate:
      type: object
      description: Label to assign to a test, identified by the ID (`groupId`).
      properties:
        groupId:
          $ref: '#/components/schemas/NumberTemplate'
    NetworkTestBaseTemplate:
      type: object
      properties:
        interval:
          description: How often the network test will run, in seconds.
          anyOf:
          - $ref: '#/components/schemas/TestInterval'
          - $ref: '#/components/schemas/HandlebarsExpression'
        port:
          $ref: '#/components/schemas/PortTemplate'
        bgpMeasurements:
          description: Enable/disable BGP measurements.
          title: BgpMeasurements
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        bandwidthMeasurements:
          description: Enable/disable bandwidth measurements.
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        mtuMeasurements:
          anyOf:
          - $ref: '#/components/schemas/BooleanNumber'
          - $ref: '#/components/schemas/HandlebarsExpression'
        numPathTraces:
          description: Number of path trace probes to run. Defaults to 3, with a range of 3 to 10.
          title: NumPathTraces
          anyOf:
          - $ref: '#/components/schemas/NumPathTracesTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        pathTraceMode:
          description: The path trace mode. Choose `inSession` to perform the path trace within a TCP session. Defaults to `classic` for network path discovery.
          title: PathTraceMode
          anyOf:
          - $ref: '#/components/schemas/PathTraceModeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        probeMode:
          description: The probe mode used by the end-to-end Network test. Only valid if the protocol is set to `TCP`. Defaults to `AUTO`.
          title: ProbeMode
          anyOf:
          - $ref: '#/components/schemas/ProbeModeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        protocol:
          description: The network transport protocol that will be used. Defaults to `TCP`.
          title: TransportProtocol
          anyOf:
          - $ref: '#/components/schemas/TransportProtocolTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
    TransportProtocolTemplate:
      description: The network transport protocol to use for the test.
      type: string
      example: TCP
      enum:
      - TCP
      - UDP
    ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    UserInputAllowedValue:
      type: object
      description: The list of values that the user is allowed to use as inputs.
      properties:
        value:
          $ref: '#/components/schemas/UserInputValue'
        name:
          type: string
          description: The name of the value, which will be used for display in the UI and API messages.
          example: West
    EndpointTcpProbeModeTemplate:
      type: string
      description: Used in TCP mode only.
      enum:
      - UNKNOWN
      - AUTO
      - SYN
      - SACK
      example: SACK
    DashboardRefreshRateTemplate:
      type: string
      description: The refresh rate of the dashboard.
      default: 'off'
      example: 'off'
      enum:
      - 'off'
      - 2m
      - 5m
      - 10m
      - 15m
      - 30m
      - 60m
    TagIdTemplate:
      description: A tag ID, typically a Handlebars reference to a tag defined in the template.
      anyOf:
      - type: string
      - $ref: '#/components/schemas/HandlebarsExpression'
      example: '{{tags.myTag.id}}'
    NumPathTracesTemplate:
      description: Number of path trace probes to run. Defaults to 3, with a range of 3 to 10.
      type: integer
      example: 3
      minimum: 3
      maximum: 10
      default: 3
    PageLoadStrategyTemplate:
      type: string
      default: normal
      example: normal
      enum:
      - none
      - eager
      - normal
    DashboardFilterListTemplate:
      type: array
      description: List of filters to be applied to a dashboard.
      uniqueItems: true
      items:
        $ref: '#/components/schemas/DashboardFilterContextTemplate'
    TransactionScriptTemplate:
      description: Transaction script for transaction test. Must be a JavaScript string with escaped quotes.
      anyOf:
      - type: string
      - $ref: '#/components/schemas/HandlebarsExpression'
    DashboardWidgetTemplate:
      type: object
      description: Configuration of a dashboard widget.
      properties:
        title:
          description: The title of the widget.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        type:
          description: The type of widget.
          anyOf:
          - $ref: '#/components/schemas/WidgetType'
          - $ref: '#/components/schemas/HandlebarsExpression'
        visualMode:
          anyOf:
          - $ref: '#/components/schemas/VisualMode'
          - $ref: '#/components/schemas/HandlebarsExpression'
        metricGroup:
          anyOf:
          - $ref: '#/components/schemas/MetricGroup'
          - $ref: '#/components/schemas/HandlebarsExpression'
        direction:
          anyOf:
          - $ref: '#/components/schemas/DashboardMetricDirection'
          - $ref: '#/components/schemas/HandlebarsExpression'
        metric:
          anyOf:
          - $ref: '#/components/schemas/DashboardMetric'
          - $ref: '#/components/schemas/HandlebarsExpression'
        filters:
          anyOf:
          - $ref: '#/components/schemas/WidgetFilters'
          - $ref: '#/components/schemas/HandlebarsExpression'
        measure:
          anyOf:
          - $ref: '#/components/schemas/ApiWidgetMeasure'
          - $ref: '#/components/schemas/HandlebarsExpression'
        fixedTimespan:
          anyOf:
          - $ref: '#/components/schemas/ApiDurationTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        shouldExcludeAlertSuppressionWindows:
          description: Excludes alert suppression window data if set to `true`.
          anyOf:
          - type: boolean
          - $ref: '#/components/schemas/HandlebarsExpression'
    SharingSettingsResponse:
      allOf:
      - $ref: '#/components/schemas/SharingSettings'
      - type: object
        properties:
          _links:
            $ref: '#/components/schemas/SharingSettingsLinks'
    EndpointServerConfigTemplate:
      description: Target server information.
      required:
      - port
      - serverName
      type: object
      properties:
        serverName:
          type: string
          description: Server host name or IP.
          example: www.example.com
        port:
          maximum: 65535
          minimum: 0
          type: integer
          description: Server port
          example: 80
    EndpointTestLabelListTemplate:
      description: A list of label IDs identifying label to be assigned.
      type: array
      items:
        $ref: '#/components/schemas/NumberTemplate'
    BooleanNumber:
      type: integer
      enum:
      - 0
      - 1
      example: 0
    EndpointIpVersionTemplate:
      description: IP version the test should use for network tests.
      type: string
      enum:
      - V4_ONLY
      - V6_ONLY
      - V6_PREFER
      - OS_DEFAULT
      example: V4_ONLY
    TagConfigurationOverride:
      type: object
      description: 'Partial override for a tag configuration defined in a template. All fields are optional;

        only the fields you specify will override the corresponding values in the base template tag.

        '
      properties:
        key:
          description: The tag's key.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        value:
          description: The tag's value.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        objectType:
          description: The type of object the tag is associated with.
          anyOf:
          - $ref: '#/components/schemas/TagObjectTypeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        accessType:
          description: The access type of the tag.
          anyOf:
          - $ref: '#/components/schemas/AccessType'
          - $ref: '#/components/schemas/HandlebarsExpression'
        color:
          description: The tag color as a hex code.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
        assignments:
          description: Override the tag assignments for this tag.
          anyOf:
          - $ref: '#/components/schemas/TagAssignmentListTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
    EndpointGenericConfigTemplate:
      description: Settings common to HTTP and Network tests.
      required:
      - interval
      - priority
      type: object
      properties:
        interval:
          description: Interval in seconds of when the test runs.
          anyOf:
          - $ref: '#/components/schemas/EndpointTestIntervalTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        priority:
          description: Define a priority for scheduling. Higher priority value will be scheduled first.
          anyOf:
          - type: integer
          - $ref: '#/components/schemas/HandlebarsExpression'
    Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    DnsTraceTestTypeTemplate:
      type: string
      description: The type of test. Cannot be templated with Handlebars.
      example: dns-trace
      default: dns-trace
    HttpServerTestTemplate:
      allOf:
      - $ref: '#/components/schemas/TestBaseTemplate'
      - $ref: '#/components/schemas/NetworkTestBaseTemplate'
      - $ref: '#/components/schemas/HttpServerTestBaseTemplate'
      - type: object
        required:
        - type
        - agents
        - interval
        properties:
          type:
            $ref: '#/components/schemas/HttpServerTestTypeTemplate'
          downloadLimit:
            $ref: '#/components/schemas/NumberTemplate'
            description: Specify maximum number of bytes to download from the target object.
          dnsOverride:
            $ref: '#/components/schemas/StringTemplate'
            description: IP address to use for DNS override.
          postBody:
            $ref: '#/components/schemas/StringTemplate'
            description: POST body to be sent with the request.
    ApiDurationTemplate:
      description: Specifies a fixed timespan for data aggregation.
      type: object
      properties:
        value:
          type: integer
          format: int32
          description: Timespan value.
          example: 10
        unit:
          $ref: '#/components/schemas/LegacyDurationUnit'
    PortTemplate:
      description: The network port.
      anyOf:
      - type: integer
      - $ref: '#/components/schemas/HandlebarsExpression'
    HandlebarsExpression:
      description: "A valid Handlebars expression. Can reference user inputs, such as `{{name}}`, or fields of other assets defined in the template.\n* `{{userInputs.<key>}}` - resolves to the user provided value the `userInput` identified its key.\n* `{{name}}` - resolves to the name of the deployed template.\n* `{{<asset key>.<field>}}` - resolves to the value of a field of another asset defined in the template identified by the asset key and field name. \nFor example, set the `testIds` field of an `alertRule` by referencing the `testId` field of a `tests` asset.\n  **Note**: Due to dependencies, assets can only reference fields of other assets that appear earlier in the hierarchy below (e.g., labels cannot reference other assets, tests can reference labels and tags, etc.)\n  - Labels\n  - Tags\n  - Tests (can reference `{{labels.*.groupId}}` and `{{tags.*.id}}`)\n  - Endpoint Tests (can reference `{{labels.*.groupId}}` and `{{tags.*.id}}`)\n  - Connected Devices Tests (can reference `{{labels.*.groupId}}` and `{{tags.*.id}}`)\n  - Alert Rules\n  - Dashboard Filters\n  - Dashboards\n\n  Tags are deployed in two phases. Every field on the tag configuration except `assignments` (`key`, `value`, `objectType`, `accessType`, and optional `color`) is applied before dependent assets so that tag IDs are available for Handlebars references (for example, `{{tags.myTag.id}}`). The `assignments` field is applied after those assets exist (for example, after the tests you reference have been created), so it can resolve deployed IDs such as `{{tests.myTest.testId}}`. Both phases run automatically during deployment.\n"
      type: string
      pattern: .*{{.*}}.*
      example: '{{userInputs.testName}}'
    DnsServerEntryTemplate:
      description: Server host name (FQDN). Example "www.example.com".
      type: object
      properties:
        serverName:
          $ref: '#/components/schemas/StringTemplate'
      required:
      - serverName
    UserInput:
      description: 'A user input is a value that the user must provide when deploying a template.

        User Input values are provided by the user in the UI under the **Global Settings** section.

        When deploying via the API, User Inputs values are specified in the payload using the `userInputValues` field.

        '
      required:
      - name
      - type
      type: object
      properties:
        name:
          type: string
          description: The name of the user input field.
          example: target
        type:
          $ref: '#/components/schemas/UserInputType'
        title:
          type: string
          description: The title of the user input field; may be used by UI.
          example: Test Target
        description:
          type: string
          description: Description of the user input field; used by UI.
          example: The target of the Tests
        defaultValue:
          $ref: '#/components/schemas/UserInputValue'
          description: Default value of user input field.
          example: https://google.com
        allowedValues:
          type: array
          description: Allowed values for the User Input. An array of name/value pairs that specify specific values that can be used with the User Input. In the UI, user inputs with `allowedValues` will be displayed as a drop down selector; the `name` will be used as the display text.
          items:
            $ref: '#/components/schemas/UserInputAllowedValue'
    EndpointTestCategoryTemplate:
      description: Whether the test is `SCHEDULED_TEST` or `DYNAMIC_APP_TEST`.
      anyOf:
      - $ref: '#/components/schemas/EndpointTestCategoryOptionsTemplate'
      - $ref: '#/components/schemas/HandlebarsExpression'
  parameters:
    AccountGroupId:
      name: aid
      in: query
      description: A unique identifier associated with your account group. You can retrieve your `AccountGroupId` from the `/account-groups` endpoint. Note that you must be assigned to the target account group. Specifying this parameter without being assigned to the target account group will result in an error response.
      required: false
      schema:
        type: string
        example: '1234'
    IdTemplate:
      name: id
      in: path
      description: The ID of the template
      required: true
      schema:
        maxLength: 36
        minLength: 10
        type: string
        format: uuid
        example: fcbb89a7-61cf-4616-9c4f-828fa3cb4684
  responses:
    '400':
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            type: about:blank
            title: Request validation failed. There are invalid or missing fields
            status: 400
            detail: Your request object contains invalid fields.
            instance: /v7
            errors:
            - code: AM-5432
              field: firstName
              message: firstName cannot have fancy characters
            - code: DASH-5622
              field: password
              message: Password cannot be blank
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    '204':
      description: No content
    '404':
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: URI Resource Not Found
            status: 404
            detail: Details explaining if the 404 error is related to an invalid URI or a wrong ID
            instance: /v7
    '500':
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Internal server error
            status: 500
            detail: Optional detail about the internal error message.
            instance: /v7
    '403':
      description: Insufficient permissions to query endpoint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication token
