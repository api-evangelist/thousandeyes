    TagConfigurationTemplate:
      type: object
      description: 'A tag configuration object for use in ThousandEyes Templates. Tags use a key/value model

        to provide meaningful metadata to ThousandEyes assets (such as tests, dashboards, endpoint tests).


        Except for `assignments`, every field on this object defines the tag itself (`key`,

        `value`, `objectType`, `accessType`, and optional `color`). In those fields, values may

        be plain strings or Handlebars expressions, but only `{{userInputs.*}}` and `{{name}}`

        references are allowed.

        References to other template assets such as `{{tests.*}}`, `{{endpointTests.*}}`, or

        `{{connectedDevicesTests.*}}` are **not permitted** in tag metadata fields and will result

        in an error during deployment.


        The `assignments` field is the exception: it supports the full Handlebars context including

        references to `{{tests.*}}`, `{{endpointTests.*}}`, and `{{connectedDevicesTests.*}}`,

        allowing you to assign tags to deployed test resources (e.g.,

        `[{ "id": "{{tests.myTest.testId}}", "type": "test" }]`).

        Alternatively, you can use the `tagIds` field on the test configuration to associate

        tags with tests.

        '
      required:
      - key
      - value
      - objectType
      - accessType
      properties:
        key:
          description: The tag's key.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
          example: branch
        value:
          description: The tag's value.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
          example: sfo
        objectType:
          description: The type of object the tag is associated with.
          anyOf:
          - $ref: '#/components/schemas/TagObjectTypeTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        accessType:
          description: The access type of the tag.
          anyOf:
          - $ref: '#/components/schemas/AccessType'
          - $ref: '#/components/schemas/HandlebarsExpression'
        color:
          description: The tag color as a hex code.
          anyOf:
          - type: string
          - $ref: '#/components/schemas/HandlebarsExpression'
          example: '#FF0000'
        assignments:
          description: 'A list of objects to assign this tag to. Unlike tag metadata fields, `assignments` supports

            the full Handlebars context including `{{tests.*}}`, `{{endpointTests.*}}`, and

            `{{connectedDevicesTests.*}}` references, allowing you to assign tags to deployed test

            resources. Assignments are processed in a second phase after all tests have been created,

            so test IDs are available for resolution. Assignments are additive: existing assignments

            from other deployments are preserved.

            '
          anyOf:
          - $ref: '#/components/schemas/TagAssignmentListTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
          example:
          - id: '{{tests.httpServerTest.testId}}'
            type: test
          - id: '{{endpointTests.scheduledHttpTest.testId}}'
            type: endpoint-test
