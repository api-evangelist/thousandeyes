          - $ref: '#/components/schemas/EndpointServerConfigTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        httpConfig:
          anyOf:
          - $ref: '#/components/schemas/EndpointHttpTestConfigTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        testLabelIds:
          description: 'A list of labels to assign to the test. Typically this value will be set using Handlebars

            reference to a user input. Example: `"testLabelIds": "[{{labels.endpointLabel.groupId}}]"`


            **Deprecation notice:** Labels (`testLabelIds`) are based on the V6 API, which is deprecated.

            Use `tagIds` instead for V7 API support. Do not use `testLabelIds` and `tagIds` together on the same test.

            '
          deprecated: true
          anyOf:
          - $ref: '#/components/schemas/EndpointTestLabelListTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
        tagIds:
          description: 'The Tags to assign to the endpoint test, identified by tag ID. Typically set using

            Handlebars references to tags defined in the template. Tags are the recommended

            replacement for labels (`testLabelIds`) and provide full V7 API support.

            '
          anyOf:
          - $ref: '#/components/schemas/TagIdListTemplate'
          - $ref: '#/components/schemas/HandlebarsExpression'
          example:
          - '{{tags.webHealthDashTag.id}}'
          - '{{tags.templateTag.id}}'
    Error:
