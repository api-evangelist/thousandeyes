  /endpoint/test-results/local-networks/topologies/filter:
    post:
      tags:
      - Local Network Endpoint Test Results
      summary: List endpoint network topologies probes
      description: "Returns a list of all endpoint local network topologies probes. \nAll results are provided, oldest to\
        \ newest (according to a specified page index and size) unless an explicit start and end is provided with `startDate`,\
        \ `endDate` or `window` optional parameters.\n\n## Request body filters\nThis endpoint supports complex filtering\
        \ using the request body.\nIt is important these filters remain unaltered when making use of pagination, otherwise\
        \ the results will not be coherent with the original request.\n\n### Multiple filter fields\nWhen multiple filter\
        \ fields are provided, a logical `AND` is applied between the filters.\n ```\ncurl --location --request POST 'https://api.thousandeyes.com/v7/endpoint/test-results/local-networks/topologies/filter'\n\
        --header 'Authorization: Bearer $token'\n--header 'Content-Type: application/json'\n--data-raw '{\n  \"searchFilters\"\
        : {\n    \"platform\": [ \"mac\" ],\n    \"domain\": [ \"thousandeyes.com\" ]\n  }}'\n```\n\n### Filter field with\
        \ multiple values\nWhen a filter field contains multiple values, a logical `OR` is applied between the filter values.\n\
        \ ```\ncurl --location --request POST 'https://api.thousandeyes.com/v7/endpoint/test-results/local-networks/topologies/filter'\n\
        --header 'Authorization: Bearer $token'\n--header 'Content-Type: application/json'\n--data-raw '{\n  \"searchFilters\"\
        : {\n    \"networkId\": [ \"660b34109d12\", \"660b34109d15\" ]\n  }}'\n```\n\n### Combination of request parameters\
        \ and body filters\n```\ncurl --location --request POST 'https://api.thousandeyes.com/v7/endpoint/test-results/local-networks/topologies/filter?window=12h'\n\
        --header 'Authorization: Bearer $token'\n--header 'Content-Type: application/json'\n--data-raw '{\n  \"searchFilters\"\
        : {\n    \"platform\": [ \"mac\" ],\n    \"domain\": [ \"thousandeyes.com\" ],\n    \"networkId\": [ \"660b34109d12\"\
        , \"660b34109d15\" ]\n  }}'\n```\n\n### Warning\nNote that a maximum of 12h worth of data can be retrieved at once.\
        \ \nIf you need more, you need to make multiple requests.\n\nReturns a `results` array of network topology probes.\
        \ \nNetwork topology probes shown are from the latest round, or based on the time range specified.\n"
      operationId: filterLocalNetworksTestResultsTopologies
      parameters:
      - $ref: '#/components/parameters/AccountGroupId'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/StartDateParameter'
      - $ref: '#/components/parameters/EndDateParameter'
      - $ref: '#/components/parameters/PaginationCursor'
      - $ref: '#/components/parameters/ExpandLocalNetworkTopology'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointNetworkTopologyResultRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/LocalNetworkTopologyResults'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
  /endpoint/test-results/local-networks/topologies/{networkTopologyId}:
    get:
      tags:
      - Local Network Endpoint Test Results
      summary: Retrieve endpoint local network topology
      description: 'Returns detailed data of a local network topology.

        '
