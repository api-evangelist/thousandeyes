          example: Webex background
        pid:
          type: integer
          description: The process ID.
          example: 15632
        cpu:
          type: number
          format: double
          description: The CPU usage by the process as a percentage (e.g., 0.5 for 50% CPU usage).
          example: 0.5
        memoryPercentage:
          type: number
          format: double
          description: The memory usage by the process as a percentage (e.g., 0.22 for 22%).
          example: 0.22
        memoryBytes:
          type: integer
          format: int64
          description: The memory usage by the process in bytes.
          example: 1023334
    VpnProfile:
      type: object
