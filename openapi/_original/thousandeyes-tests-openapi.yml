    VoiceTestRequest:
      allOf:
      - $ref: '#/components/schemas/UnexpandedVoiceTest'
      - $ref: '#/components/schemas/TestRequest'
      - $ref: '#/components/schemas/MonitorsRequest'
    VoiceTestResponse:
      allOf:
      - $ref: '#/components/schemas/VoiceTest'
      - type: object
        properties:
          agents:
            $ref: '#/components/schemas/TestAgentsResponse'
    InterfaceGroups:
      type: object
      properties:
        pathVisInterfaceGroups:
          type: array
          items:
            $ref: '#/components/schemas/InterfaceGroup'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    InterfaceGroup:
      type: object
      properties:
        aid:
          type: string
          description: Account Group Id
          readOnly: true
          example: '1234'
        groupId:
          type: string
          description: Group ID
          readOnly: true
          example: '281474976710706'
        groupName:
          type: string
          description: Name of the path visualization interface group
          example: PathVis Interface Group
        ipAddresses:
          type: array
          items:
            type: string
          description: Array of IP addresses associated with the interface group
          example:
          - 1.1.1.1
          - 8.8.8.8
        rdnsRegexes:
          type: array
          readOnly: true
          items:
            type: string
          description: Array of RDNS Regexes associated with the interface group
          example:
          - aggr403b-1.iad3.rackspace.net
          - aggr403c-1.iad3.rackspace.net
    TestVersionHistory:
      type: object
      properties:
        versionTimestamp:
          type: string
          format: date-time
          description: Timestamp when this version was created.
          example: '2022-07-17T22:00:54Z'
        testId:
          type: string
          description: The unique identifier of the test.
          example: '474276'
        createdBy:
          type: string
          description: The user who created the version.
          example: user (user@user.com)
        versionId:
          type: string
          description: The unique identifier for a specific version of the test settings.
          example: '1234'
    TestVersionHistoryResponse:
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/SelfLinks'
        testVersionHistory:
          type: array
          items:
            $ref: '#/components/schemas/TestVersionHistory'
      additionalProperties: false
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: invalid_token
        error_description:
          type: string
          example: Invalid access token
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type. When this member is not present, its value is assumed
            to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
    ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          errors:
            nullable: true
            type: array
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/ValidationErrorItem'
    TestInterval:
      type: integer
      enum:
      - 60
      - 120
      - 300
      - 600
      - 900
      - 1800
      - 3600
      description: Interval between test runs in seconds.
      default: 60
      example: 60
    Enabled:
      type: boolean
      description: Test is enabled.
      example: true
      default: true
    TestCreatedBy:
      type: string
      description: User that created the test.
      example: user@user.com
      readOnly: true
    TestCreatedDate:
      type: string
      format: date-time
      description: UTC created date (ISO date-time format).
      example: '2022-07-17T22:00:54Z'
      readOnly: true
    TestType:
      type: string
      enum:
      - api
      - agent-to-agent
      - agent-to-server
      - bgp
      - http-server
      - page-load
      - web-transactions
      - ftp-server
      - dns-trace
      - dns-server
      - dnssec
      - sip-server
      - voice
      description: This is a read only value, as test type is implicit in the test creation url.
      readOnly: true
      example: agent-to-server
    Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that
            should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    TestSelfLink:
      allOf:
      - $ref: '#/components/schemas/Link'
      - description: Reference to the test.
        example:
          href: https://api.thousandeyes.com/v7/tests/{type}/281474976710706
    TestResults:
      type: array
      description: Reference to the test results.
      items:
        $ref: '#/components/schemas/Link'
      example:
      - href: https://api.thousandeyes.com/v7/test-results/281474976710706/network
      - href: https://api.thousandeyes.com/v7/test-results/281474976710706/path-vis
    TestLinks:
      type: object
      description: A list of links that can be accessed to get more information
      properties:
        self:
          $ref: '#/components/schemas/TestSelfLink'
        testResults:
          $ref: '#/components/schemas/TestResults'
      readOnly: true
    SimpleTest:
      description: Each test includes additional fields depending on its `type`. Refer `/tests/{type}` endpoint to know the
        set of fields returned by a given `type`.
      additionalProperties: true
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/TestInterval'
        alertsEnabled:
