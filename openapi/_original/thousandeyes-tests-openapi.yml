components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication token
  parameters:
    InterfaceGroupId:
      name: interfaceGroupId
      description: ID of the network path vis interface group
      required: true
      in: path
      schema:
        type: string
        example: '281474976710706'
    ExpandTest:
      name: expand
      in: query
      description: Optional parameter on whether or not to expand the test sub-resources. By default no expansion is going
        to take place if the query parameter is not present. If the user wishes to expand the `agents` sub-resource, they
        need to pass the `?expand=agent` query.
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ExpandTestOptions'
        example:
        - agent
        - monitor
    ExpandBgpTest:
      name: expand
      in: query
      description: Optional parameter on whether or not to expand the test sub-resources. By default no expansion takes place
        if the query parameter is not present. To expand the `monitors` sub-resource, pass the `?expand=monitor` query.
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ExpandBgpTestOptions'
        example:
        - alert-rule
        - monitor
    AccountGroupId:
      name: aid
      in: query
      description: A unique identifier associated with your account group. You can retrieve your `AccountGroupId` from the
        `/account-groups` endpoint. Note that you must be assigned to the target account group. Specifying this parameter
        without being assigned to the target account group will result in an error response.
      required: false
      schema:
        type: string
        example: '1234'
    TestIdPath:
      name: testId
      description: Test ID
      required: true
      in: path
      schema:
        type: string
        example: '202701'
    VersionId:
      name: versionId
      in: query
      description: The unique identifier for a specific version of the test settings. If provided, returns the test configuration
        as it existed at that version. To retrieve available version IDs, use the `/tests/{testId}/history` endpoint. If not
        specified, the current version of the test settings is returned.
      required: false
      schema:
        type: string
        example: '1234'
  schemas:
    ExpandTestOptions:
      type: string
      enum:
      - agent
      - alert-rule
      - monitor
      - label
      - tag
      - shared-with-account
      example: agent
    ExpandBgpTestOptions:
      type: string
      enum:
      - alert-rule
      - monitor
      - label
      - tag
      - shared-with-account
      example: monitor
    Tests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/SimpleTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    TestRequest:
      allOf:
      - $ref: '#/components/schemas/BaseRequest'
      - type: object
        properties:
          agents:
            $ref: '#/components/schemas/TestAgentsRequest'
      required:
      - agents
    BaseRequest:
      type: object
      properties:
        labels:
          type: array
          description: Contains list of test label IDs (get `labelId` from `/labels` endpoint)
          writeOnly: true
          readOnly: false
          items:
            type: string
          example:
          - '9842'
          - '1283'
        tags:
          type: array
          description: Contains list of test tag IDs (get `id` from `/tags` endpoint).
          writeOnly: true
          readOnly: false
          items:
            type: string
          example:
          - c6b78e57-81a2-4c5f-a11a-d96c3c664d55
          - ec8e64fb-6f11-485c-a5d5-488098ad626a
        sharedWithAccounts:
          type: array
          description: Contains list of account group IDs. Test is shared with the listed account groups (get `aid` from `/account-groups`
            endpoint)
          writeOnly: true
          readOnly: false
          items:
            type: string
          example:
          - '1234'
          - '12345'
        alertRules:
          type: array
          items:
            type: string
          description: List of alert rules IDs to apply to the test (get `ruleId` from `/alerts/rules` endpoint. If `alertsEnabled`
            is set to `true` and `alertRules` is not included on test creation or update, applicable user default alert rules
            will be used)
          writeOnly: true
          readOnly: false
          example:
          - '344753'
          - '212697'
    MonitorsRequest:
      type: object
      properties:
        monitors:
          type: array
          description: Contains list of BGP monitor IDs (get `monitorId` from `/monitors` endpoint)
          writeOnly: true
          readOnly: false
          items:
            type: string
          example:
          - '17410'
          - '5'
    BgpTests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/UnexpandedBgpTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    BgpTestRequest:
      allOf:
      - $ref: '#/components/schemas/UnexpandedBgpTest'
      - $ref: '#/components/schemas/BaseRequest'
      - $ref: '#/components/schemas/MonitorsRequest'
    UpdateBgpTestRequest:
      allOf:
      - $ref: '#/components/schemas/BaseBgpRequest'
      - $ref: '#/components/schemas/BaseRequest'
      - $ref: '#/components/schemas/MonitorsRequest'
    BgpTestResponse:
      allOf:
      - $ref: '#/components/schemas/BgpTest'
    AgentToServerTests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/UnexpandedAgentToServerTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    AgentToServerTestRequest:
      allOf:
      - $ref: '#/components/schemas/UnexpandedAgentToServerTest'
      - $ref: '#/components/schemas/TestRequest'
      - $ref: '#/components/schemas/MonitorsRequest'
      - type: object
        properties:
          port:
            type: integer
            description: Port number to use for the test. The default port is 80.
            example: 443
    UpdateAgentToServerTestRequest:
      allOf:
      - $ref: '#/components/schemas/BaseRequest'
      - $ref: '#/components/schemas/MonitorsRequest'
      - $ref: '#/components/schemas/AgentToServerWritablePropertyFields'
      - type: object
        properties:
          agents:
            $ref: '#/components/schemas/TestAgentsRequest'
          interval:
            $ref: '#/components/schemas/TestInterval'
          alertsEnabled:
            type: boolean
            description: Indicates if alerts are enabled.
            example: true
          enabled:
            $ref: '#/components/schemas/Enabled'
          description:
            type: string
            description: A description of the test.
            example: ThousandEyes Test
          testName:
            $ref: '#/components/schemas/TestName'
          bgpMeasurements:
            $ref: '#/components/schemas/TestBgpMeasurements'
          usePublicBgp:
            $ref: '#/components/schemas/TestUsePublicBgp'
          port:
            type: integer
            description: Port number to use for the test. The default port is 80.
            example: 443
    AgentToServerTestResponse:
      allOf:
      - $ref: '#/components/schemas/AgentToServerTest'
      - type: object
        properties:
          agents:
            $ref: '#/components/schemas/TestAgentsResponse'
    AgentToAgentTests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/UnexpandedAgentToAgentTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    AgentToAgentTestRequest:
      allOf:
