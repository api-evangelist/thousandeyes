            $ref: '#/components/schemas/TestAgentsResponse'
    DnsSecTests:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: '#/components/schemas/UnexpandedDnsSecTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    DnsSecTestRequest:
      allOf:
      - $ref: '#/components/schemas/UnexpandedDnsSecTest'
