  /test-results/{testId}/sip-server:
    get:
      tags:
      - Voice SIP Server Test Results
      summary: Get SIP server test results
      description: 'Returns Voice SIP server test results. If no window, start time, or end time is specified, data for the
        most recent round is returned. If a window or start time is specified, the results might include a round that started
        just before the specified start time.

        '
      operationId: getTestSipServerResults
      parameters:
      - $ref: '#/components/parameters/TestIdPath'
      - $ref: '#/components/parameters/AccountGroupId'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/StartDateParameter'
      - $ref: '#/components/parameters/EndDateParameter'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SipServerTestResults'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        default:
          $ref: '#/components/responses/GeneralError'
  /test-results/{testId}/rtp-server:
    get:
      tags:
      - Voice RTP Server Test Results
      summary: Retrieve RTP server test metrics
      description: 'Returns Voice RTP server test results. If no window, start time, or end time is specified, data for the
        most recent round is returned. If a window or start time is specified, the results might include a round that started
        just before the specified start time.

        '
      operationId: getTestRtpServerResults
      parameters:
      - $ref: '#/components/parameters/TestIdPath'
      - $ref: '#/components/parameters/AccountGroupId'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/StartDateParameter'
      - $ref: '#/components/parameters/EndDateParameter'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RtpStreamTestResults'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        default:
          $ref: '#/components/responses/GeneralError'
  /test-results/{testId}/bgp:
    get:
      tags:
      - Network BGP Test Results
      summary: Get BGP test results
      description: 'Returns a list of BGP monitors actively monitoring the destination''s target prefix. This list includes
        information about the prefix, its associated AS Number, and provides details regarding reachability, path updates,
        and any changes in the path for the target network.

        '
      operationId: getTestBgpResults
      parameters:
      - $ref: '#/components/parameters/TestIdPath'
      - $ref: '#/components/parameters/AccountGroupId'
      - $ref: '#/components/parameters/Window'
      - $ref: '#/components/parameters/StartDateParameter'
      - $ref: '#/components/parameters/EndDateParameter'
      - $ref: '#/components/parameters/PaginationCursor'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BgpTestResults'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        default:
          $ref: '#/components/responses/GeneralError'
  /test-results/{testId}/bgp/routes/prefix/{prefixId}/round/{roundId}:
    get:
      tags:
      - Network BGP Test Results
      summary: Get BGP route test results by prefix
      description: 'Returns an ordered list of networks crossed by a particular network prefix, including assigned monitors
        for the test and the paths taken to reach the destination. This is similar to revealing ASPath details found in a
        BGP Routing Information Base (rib) dump.

        '
      operationId: getTestBgpRoutesPrefixRoundResults
      parameters:
      - $ref: '#/components/parameters/TestIdPath'
      - $ref: '#/components/parameters/PrefixIdPath'
      - $ref: '#/components/parameters/RoundIdPath'
      - $ref: '#/components/parameters/AccountGroupId'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/BgpTestRouteInformationResults'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '502':
          $ref: '#/components/responses/502'
        default:
          $ref: '#/components/responses/GeneralError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication token
  parameters:
    PrefixIdPath:
      name: prefixId
      description: The ID of the prefix. You can get `prefixId` from the `/test-results/{testId}/bgp` endpoint.
      required: true
      in: path
      schema:
        type: string
        example: '3789376546'
    ServerIdPath:
      name: serverId
      description: DNS server ID
      required: true
      in: path
      schema:
        type: string
        example: '281474976710706'
    HttpServerExpand:
      name: expand
      in: query
      style: form
      explode: false
      description: This parameter lets you decide if you want to see more details about test results. By default, no extra
        information is shown unless you use the query parameter. For instance, if you want more info about the "header," add
        ?expand=header to the query.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Expand'
        example:
        - certificate
    Direction:
      name: direction
      in: query
      style: form
      description: 'Choose the direction for the metrics you want: [`from-target`, `to-target`, `bidirectional`]. This applies
        when you''re doing bidirectional Agent-to-Agent tests. For bidirectional data, you''ll get combined results; otherwise,
        you''ll get data for one direction. If you try to get unidirectional test data with an incorrect direction parameter,
        it will trigger an error response.'
      schema:
        $ref: '#/components/schemas/TestDirection'
    PathVisDirection:
      name: direction
      in: query
      style: form
      description: 'Choose the direction for the metrics you want: [`from-target`, `to-target`]. This applies when you''re
        doing bidirectional Agent-to-Agent tests. Omitting the parameter will default the results to both `from-target` and
        `to-target` values (bidirectional); otherwise, you''ll get data for one direction. If you try to get unidirectional
        test data with an incorrect direction parameter, it will trigger an error response.'
      schema:
        $ref: '#/components/schemas/PathVisDirection'
    TestIdPath:
      name: testId
      description: Test ID
      required: true
      in: path
      schema:
        type: string
        example: '202701'
    AccountGroupId:
      name: aid
      in: query
      description: A unique identifier associated with your account group. You can retrieve your `AccountGroupId` from the
        `/account-groups` endpoint. Note that you must be assigned to the target account group. Specifying this parameter
        without being assigned to the target account group will result in an error response.
      required: false
      schema:
        type: string
        example: '1234'
    Window:
      name: window
      in: query
      description: 'A dynamic time interval up to the current time of the request. Specify the interval as a number followed
        by an optional type: `s` for seconds (default if no type is specified), `m` for minutes, `h` for hours, `d` for days,
        and `w` for weeks.

        For a precise date range, use `startDate` and `endDate`.'
      schema:
        type: string
        pattern: ^\d+(?:[smhdw]{1})?$
        example: 12h
    StartDateParameter:
      name: startDate
      in: query
      description: Use with the `endDate` parameter. Include the complete time (hours, minutes, and seconds) in UTC time zone,
        following the ISO 8601 date-time format. See the example for reference. Please note that this parameter can't be used
        with `window`.
      schema:
        type: string
        format: date-time
        example: '2022-07-17T22:00:54Z'
    EndDateParameter:
      name: endDate
      in: query
      description: Defaults to current time the request is made. Use with the `startDate` parameter. Include the complete
        time (hours, minutes, and seconds) in UTC time zone, following the ISO 8601 date-time format. See the example for
        reference. Please note that this parameter can't be used with `window`.
      schema:
        type: string
        format: date-time
        example: '2022-07-18T22:00:54Z'
    PaginationCursor:
      name: cursor
      in: query
      example: null
      description: (Optional) Opaque cursor used for pagination. Clients should use `next` value from `_links` instead of
        this parameter.
      schema:
        type: string
        example: null
    AgentIdPath:
      name: agentId
      description: Agent ID
      required: true
      in: path
      schema:
        type: string
        example: '11'
    RoundIdPath:
      name: roundId
      description: Round ID
      required: true
      in: path
      schema:
        type: string
        example: '1384309800'
    PageIdPath:
      name: pageId
      description: Web page ID
      required: true
      in: path
      schema:
        type: string
        example: '281474976710706'
  schemas:
    Expand:
      type: string
      enum:
      - header
      - certificate
      example: header
    NetworkTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/NetworkTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    NetworkTestResult:
      allOf:
      - type: object
        properties:
          availableBandwidth:
            type: number
            description: The bandwidth from the client to the server measured in Mbps. This value is not available if bandwidth
              testing is disabled, if no value could be calculated, or if the target is a proxy.
            example: 9.100464
            format: double
            readOnly: true
          avgLatency:
            type: number
            description: Average RTT for packets sent to destination
            example: 167.04
            format: double
            readOnly: true
          bandwidth:
            type: number
            example: 4.3313155
            format: double
            readOnly: true
          capacity:
            type: number
            description: The capacity from the client to the server measured in Mbps. This value is not available if bandwidth
              testing is disabled, if no value could be calculated, or if the target is a proxy.
            example: 210.10854
            format: double
            readOnly: true
          jitter:
            type: number
            description: Standard deviation of latency
            example: 0.076808
            format: double
            readOnly: true
          loss:
            type: number
            description: Percentage of packets not reaching the destination. This field is omitted when no loss measurement
              is available.
            example: 0
            format: double
            readOnly: true
          maxLatency:
            type: number
            description: Maximum RTT for packets sent to destination
            example: 168
            format: double
            readOnly: true
          minLatency:
            type: number
            description: Minimum RTT for packets sent to destination
            example: 167
            format: double
            readOnly: true
          proxyLoss:
            type: number
            description: Percentage of packets not reaching proxy.
            example: 2.5
            format: float
            readOnly: true
          proxyAverageLatency:
            type: number
            description: Average RTT for packets sent to proxy, in milliseconds.
            example: 45
            format: float
            readOnly: true
          proxyMinLatency:
            type: number
            description: Minimum RTT for packets sent to proxy, in milliseconds.
            example: 40
            format: float
            readOnly: true
          proxyMaxLatency:
            type: number
            description: Maximum RTT for packets sent to proxy, in milliseconds.
            example: 50
            format: float
            readOnly: true
          proxyJitter:
            type: number
            description: Standard deviation of proxy latency, in milliseconds.
            example: 1.2
            format: float
            readOnly: true
          packetsBySecond:
            type: array
            description: Number of packets sent and received in a second.
            example:
            - []
            - - 0
            - - 2
            - - 2
              - 1
            - - 1
              - 1
            items:
              type: array
              items:
                type: integer
            readOnly: true
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          date:
            type: string
            description: Data point date in UTC (ISO date-time format).
            format: date-time
            example: '2022-07-17T22:00:54Z'
            readOnly: true
          roundId:
            type: integer
            description: Epoch time (seconds) indicating the start time of the round
            example: 1384309800
            readOnly: true
          serverIp:
            type: string
            description: IP of target server
            example: 50.18.127.223
            readOnly: true
          server:
            type: string
            description: Target server, including port (if method used is TCP)
            example: www.thousandeyes.com:80
            readOnly: true
          healthScore:
            type: number
            description: A normalized value (0.0-1.0) representing the network connection health of the test target. Returns
              negative values as error codes. -1.0 indicates there was insufficient data to calculate the health score.
            example: 0.98
          direction:
            $ref: '#/components/schemas/TestDirection'
          errorDetails:
            allOf:
            - $ref: '#/components/schemas/TestResultErrorDetails'
            description: Error details. This field is omitted when no error occurs.
      - $ref: '#/components/schemas/TestResult'
      - $ref: '#/components/schemas/EpochTimeWindow'
    PathVisDetailTestResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/PathVisDetailTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    PathVisDetailTestResult:
      allOf:
      - $ref: '#/components/schemas/PathVisBaseTestResult'
      - type: object
        properties:
          pathTraces:
            type: array
            description: Shows 3 iterations of path trace, with each iteration specified by a pathId
            items:
              $ref: '#/components/schemas/PathVisRoute'
    PathVisTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/PathVisTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    PathVisTestResult:
      allOf:
      - type: object
        properties:
          pathTraces:
            type: array
            description: Shows all iterations of path trace, with each iteration specified by a pathId
            items:
              $ref: '#/components/schemas/PathTrace'
      - $ref: '#/components/schemas/PathVisBaseTestResult'
    PathVisBaseTestResult:
      allOf:
      - $ref: '#/components/schemas/TestResult'
      - $ref: '#/components/schemas/EpochTimeWindow'
      - type: object
        properties:
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          server:
            type: string
            description: Target server, including port (if method used is TCP)
            example: www.google.com:443
            readOnly: true
          serverIp:
            type: string
            description: IP of target server
            example: 172.217.170.68
            readOnly: true
          sourceIp:
            type: string
            description: IP address of source agent
            example: 196.40.106.237
            readOnly: true
          sourcePrefix:
            type: string
            description: IP prefix of source agent
            example: 196.40.96.0/20
            readOnly: true
          targetIsProxy:
            type: boolean
            description: Specifies whether the traces are targeting a proxy. If not set, it is considered as false.
            example: true
            readOnly: true
          direction:
            $ref: '#/components/schemas/PathVisDirection'
    PathVisRoute:
      type: object
      properties:
        pathId:
          type: string
          description: Unique ID of path trace
          example: '4711301366345855606023718047703941305741293841502186803'
          readOnly: true
        hops:
          type: array
          description: Array of hop objects indicating each step in the traceroute
          items:
            $ref: '#/components/schemas/PathVisHop'
    PathVisHop:
      type: object
      properties:
        hop:
          type: integer
          description: Hop index
          example: 1
          readOnly: true
        ipAddress:
          type: string
          description: IP address of the hop
          example: 196.40.106.237
          readOnly: true
        prefix:
          type: string
          description: Prefix of IP address shown in CIDR
          example: 196.40.96.0/20
          readOnly: true
        rdns:
          type: string
          description: Reverse DNS entry of IP, if available
          example: core-router1.cpt2.host-h.net
          readOnly: true
        network:
          type: string
          description: Autonomous System originating the prefix
          example: HETZNER (Pty) Ltd (AS 37153)
          readOnly: true
        responseTime:
          type: integer
          description: RTT to the hop’s IP in milliseconds
          example: 1
          readOnly: true
        location:
          type: string
          description: Location information for the hop
          example: Cape Town, South Africa
          readOnly: true
        mpls:
          type: string
          description: Multiprotocol Label Switching information, if available
          readOnly: true
    PathTrace:
      type: object
      properties:
        ipAddress:
          type: string
          description: IP address of the hop
          example: 196.40.106.237
          readOnly: true
        mss:
          type: integer
          description: Maximum segment size in bytes
          example: 1460
          readOnly: true
        numberOfHops:
          type: integer
          description: Number of hops for path trace to destination
          example: 15
          readOnly: true
        pathId:
          type: string
          description: Unique ID of path trace
          example: '1230899668701775614109128428722974545787322404682781961521'
          readOnly: true
        pathMtu:
          type: integer
          description: MTU sizes on network from agents to the target
          example: 1500
          readOnly: true
        responseTime:
          type: integer
          description: RTT of the path trace to the destination in milliseconds
          example: 1500
          readOnly: true
    PathVisDirection:
      type: string
      enum:
      - to-target
      - from-target
      description: Direction of the path trace.
      example: to-target
    HttpTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/HttpTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    HttpTestResult:
      allOf:
      - $ref: '#/components/schemas/TestResult'
      - $ref: '#/components/schemas/EpochTimeWindow'
      - type: object
        properties:
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          serverIp:
            type: string
            description: IP address of destination server
            example: 193.2.1.88
            readOnly: true
          responseCode:
            type: integer
            description: HTTP response code
            example: 200
          numRedirects:
            type: integer
            description: Number of redirects
            example: 0
          redirectTime:
            type: integer
            description: Cumulative redirect timing in milliseconds
            example: 10
          dnsTime:
            type: integer
            description: Time required to resolve DNS in milliseconds
            example: 0
          dnsServerMeasurement:
            allOf:
            - $ref: '#/components/schemas/DnsServerMeasurement'
            example:
              usedDnsResponse:
                id: 41837
                qr: response
                opcode: query
                authoritativeAnswer: false
                truncation: false
                recursionDesired: true
                recursionAvailable: true
                zero: false
                authenticData: false
                checkingDisabled: false
                responseCode: noerror
                question:
                - name: www.example.com
                  type: a
                  class: in
                  ttl: 0
                  data: ''
                answer:
                - name: www.example.com
                  type: a
                  class: in
                  ttl: 300
                  data: 203.0.113.10
                dnsResolver: 8.8.8.8
                timing:
                  startTimeUs: '1769706600000000'
                  totalTimeUs: 19304
                protocol: udp
              unusedDnsResponses:
              - id: 41838
                qr: response
                opcode: query
                authoritativeAnswer: false
                truncation: false
                recursionDesired: true
                recursionAvailable: true
                zero: false
                authenticData: false
                checkingDisabled: false
                responseCode: nxdomain
                question:
                - name: www.example.com
                  type: aaaa
                  class: in
                  ttl: 0
                  data: ''
                dnsResolver: 8.8.4.4
                timing:
                  startTimeUs: '1769706600020000'
                  totalTimeUs: 15420
                protocol: udp
              usedHostsFile: false
              resolvedIp: 203.0.113.10
          sslTime:
            type: integer
            description: Time to negotiate SSL/TLS in milliseconds
            example: 9
          connectTime:
            type: integer
            description: Time required to establish a TCP connection to the server
            example: 2
          waitTime:
            type: integer
            description: Time elapsed between completion of request and first byte of response in milliseconds
            example: 3
          receiveTime:
            type: integer
            description: Elapsed time between first and last byte of response in milliseconds
            example: 1
          wireSize:
            type: integer
            description: Size of content in bytes
            example: 9993
          responseTime:
            type: integer
            description: Time to first byte in milliseconds
            example: 14
          throughput:
            type: number
            format: double
            description: WireSize divided by receiveTime in byter per second
            example: 123
          totalTime:
            type: integer
            description: response time + receive time
            example: 15
          headers:
            $ref: '#/components/schemas/HttpTestResultHeaders'
          errorType:
            type: string
            description: Type of error encountered; corresponds to phase of connection
            example: None
            readOnly: true
          errorDetails:
            $ref: '#/components/schemas/TestResultErrorDetails'
          sslCipher:
            type: string
            description: Cipher suite
          sslVersion:
            type: string
            description: TLS version
            example: TLSv1.3
          sslCertificates:
            type: array
            items:
              $ref: '#/components/schemas/SslCert'
          healthScore:
            type: number
            description: A normalized value (0.0-1.0) representing the web application connection health of the test target.
              Returns negative values as error codes. -1.0 indicates there was insufficient data to calculate the health score.
            example: 0.98
    HttpTestResultHeaders:
      type: object
      description: Expandable object containing both request and response headers
      properties:
        requestHeaders:
          type: string
          description: 'Crlf-delimited list of request headers in header: value format'
          example: "GET / HTTP/1.1\r\nHost: www.thousandeyes.com\r\nUser-Agent: curl/7.58.0-DEV\r\nAccept: */*\r\nAccept-Encoding:\
            \ deflate, gzip\r\nX-ThousandEyes-Agent: yes\r\n"
        responseHeaders:
          type: string
          description: 'crlf-delimited list of response headers in header: value format'
          example: "HTTP/1.1 200 OK\r\nContent-Type: text/html;charset=UTF-8\r\nContent-Length: 9993\r\nConnection: keep-alive\r\
            \nDate: Mon, 04 May 2020 16:13:00 GMT\r\nServer: Apache\r\nContent-Language: en-US\r\nContent-Encoding: gzip\r\
            \nX-Frame-Options: sameorigin\r\nCache-Control: max-age=600, must-revalidate\r\nStrict-Transport-Security: max-age=31536000\r\
            \nX-Content-Type-Options: nosniff\r\nX-XSS-Protection: 1; mode=block\r\nVary: Accept-Encoding\r\nX-Cache: Hit\
            \ from cloudfront\r\nVia: 1.1 7ba3caf71ae7a52dd411d1a543e80cd8.cloudfront.net (CloudFront)\r\nX-Amz-Cf-Pop: SFO5-C3\r\
            \nX-Amz-Cf-Id: w4h42tkoJD-rEpkRDZUvnQBmy26GVGe6pUsuRr1Dphf7oajYbjXaOA==\r\nAge: 132\r\n"
    SslCert:
      type: object
      properties:
        daysUntilExpiry:
          type: integer
          description: Days until certificate expires, rounded down. 0 is shown if there are less than 24 hours remaining.
            Calculated when the test was executed.
          example: 0
