            type: string
            description: Target agent IP address
            example: 193.2.1.88
            readOnly: true
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          availability:
            type: number
            format: float
            description: availability of the service
            example: 100
            readOnly: true
          connectTime:
            type: integer
            description: Time required to establish a TCP connection to the server in milliseconds, only available when TCP
              is configured as protocol
            example: 5
            readOnly: true
          dnsTime:
            type: integer
            description: Time required to resolve DNS in milliseconds
            example: 2
            readOnly: true
          inviteTime:
            type: integer
            description: Time to complete INVITE in milliseconds
            example: 10
            readOnly: true
          optionsTime:
            type: integer
            description: Time to complete OPTIONS in milliseconds
            example: 17
            readOnly: true
          numRedirects:
            type: integer
            description: Number of redirects
            example: 0
            readOnly: true
          optionsRequest:
            type: string
            description: Entire OPTIONS request
            example: "OPTIONS sip:6054@voice.sfo2.notarealco.com SIP/2.0\r\nVia: SIP/2.0/TCP 38.140.61.68:55431;branch=z9hG4bKRTzPzMoVh0;rport\r\
              \nFrom: <sip:6054@voice.sfo2.notarealco.com>;tag=cGaJDNKQFE\r\nTo: <sip:6054@voice.sfo2.notarealco.com>\r\n\
              Call-ID: oO9WaL3av8@38.140.61.68\r\nCSeq: 3 OPTIONS\r\nContact: <sip:6054@38.140.61.68:55431;transport=tcp>\r\
              \nUser-Agent: ThousandEyes Test Call\r\nAllow: INVITE, ACK, CANCEL, BYE\r\nSupported: outbound, path\r\nMax-Forwards:\
              \ 70\r\nExpires: 60\r\nContent-Length: 0\r\n\r\n\nOPTIONS sip:6054@voice.sfo2.notarealco.com SIP/2.0\r\nVia:\
              \ SIP/2.0/TCP 38.140.61.68:55431;branch=z9hG4bKRTzPzMoVh0;rport\r\nFrom: <sip:6054@voice.sfo2.notarealco.com>;tag=cGaJDNKQFE\r\
              \nTo: <sip:6054@voice.sfo2.notarealco.com>\r\nCall-ID: oO9WaL3av8@38.140.61.68\r\nCSeq: 4 OPTIONS\r\nContact:\
              \ <sip:6054@38.140.61.68:55431;transport=tcp>\r\nAuthorization: Digest username=\"al6054\", realm=\"asterisk\"\
              , nonce=\"1598728080/4e3bef2c789bdfa45ce9123221e08c8f\", uri=\"sip:6054@voice.sfo2.notarealco.com\", response=\"\
              83c538a39ff766cf75ffd1d62317b442\", algorithm=MD5, cnonce=\"0a4f113b\", opaque=\"748ffa241d840721\", qop=auth,\
              \ nc=00000001\r\nUser-Agent: ThousandEyes Test Call\r\nAllow: INVITE, ACK, CANCEL, BYE\r\nSupported: outbound,\
              \ path\r\nMax-Forwards: 70\r\nExpires: 60\r\nContent-Length: 0\r\n\r\n"
            readOnly: true
          optionsResponse:
            type: string
            description: Entire OPTIONS response
            example: "SIP/2.0 401 Unauthorized\r\nVia: SIP/2.0/TCP 38.140.61.68:55431;rport=55431;received=38.140.61.68;branch=z9hG4bKRTzPzMoVh0\r\
              \nCall-ID: oO9WaL3av8@38.140.61.68\r\nFrom: <sip:6054@voice.sfo2.notarealco.com>;tag=cGaJDNKQFE\r\nTo: <sip:6054@voice.sfo2.notarealco.com>;tag=z9hG4bKRTzPzMoVh0\r\
              \nCSeq: 3 OPTIONS\r\nWWW-Authenticate: Digest  realm=\"asterisk\",nonce=\"1598728080/4e3bef2c789bdfa45ce9123221e08c8f\"\
              ,opaque=\"748ffa241d840721\",algorithm=md5,qop=\"auth\"\r\nServer: Asterisk PBX 16.4.0\r\nContent-Length:  0\r\
              \n\r\n\nSIP/2.0 200 OK\r\nVia: SIP/2.0/TCP 38.140.61.68:55431;rport=55431;received=38.140.61.68;branch=z9hG4bKRTzPzMoVh0\r\
              \nCall-ID: oO9WaL3av8@38.140.61.68\r\nFrom: <sip:6054@voice.sfo2.notarealco.com>;tag=cGaJDNKQFE\r\nTo: <sip:6054@voice.sfo2.notarealco.com>;tag=z9hG4bKRTzPzMoVh0\r\
              \nCSeq: 4 OPTIONS\r\nAccept: application/xpidf+xml, application/cpim-pidf+xml, application/simple-message-summary,\
              \ application/pidf+xml, application/dialog-info+xml, application/simple-message-summary, application/pidf+xml,\
              \ application/dialog-info+xml, application/sdp, message/sipfrag;version=2.0\r\nAllow: OPTIONS, REGISTER, SUBSCRIBE,\
              \ NOTIFY, PUBLISH, INVITE, ACK, BYE, CANCEL, UPDATE, PRACK, MESSAGE, REFER\r\nSupported: 100rel, timer, replaces,\
              \ norefersub\r\nAccept-Encoding: text/plain\r\nAccept-Language: en\r\nServer: Asterisk PBX 16.4.0\r\nContent-Length:\
              \  0\r\n\r\n"
            readOnly: true
          registerTime:
            type: integer
            description: Time to complete REGISTER in milliseconds
            example: 21
            readOnly: true
          responseCode:
            type: integer
            description: SIP server response code
            example: 200
            readOnly: true
          responseTime:
            type: integer
            description: Time to first byte
            example: 12
            readOnly: true
          totalTime:
            type: integer
            description: Total time
            example: 40
            readOnly: true
          waitTime:
            type: integer
            description: Time elapsed between completion of request and first byte of response
            example: 5
            readOnly: true
          errorType:
            $ref: '#/components/schemas/SipServerErrorType'
          problemDetail:
            type: string
            description: Error details, if an error was encountered
            readOnly: true
    SipServerErrorType:
      type: string
      enum:
      - none
      - dns
      - connect
      - register
      - invite
      - option
      - server
      - ssl
      description: Error type, none if there is no error
      example: none
      readOnly: true
    RtpStreamTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/RtpStreamTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    RtpStreamTestResult:
      allOf:
      - $ref: '#/components/schemas/TestResult'
      - $ref: '#/components/schemas/EpochTimeWindow'
      - type: object
        properties:
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          serverIp:
            type: string
            description: Target agent IP address
            example: 172.97.102.37
            readOnly: true
          dscp:
            type: string
            description: DSCP value received by the server from the agent
            example: '46'
            readOnly: true
          dscpName:
            type: string
            description: Name of DSCP value received by the server from the agent
            example: EF (DSCP 46)
            readOnly: true
          mos:
            type: number
            format: float
            description: Mean opinion score for agent’s stream
            example: 4.351024
            readOnly: true
          codecName:
            type: string
            description: Name of codec used by agen
            example: G.711 @ 64 Kbps
            readOnly: true
          codecMaxMos:
            type: number
            format: float
            description: Maximum value of Mean Opinion Score based on codec selection
            example: 4.41
            readOnly: true
          loss:
            type: number
            format: float
            description: Percentage value of packets sent from agent not received by server
            example: 0
            readOnly: true
          discards:
            type: number
            format: float
            description: Percentage of packets discarded
            example: 0
            readOnly: true
          latency:
            type: integer
            description: Time to send packets from source to server in milliseconds
            example: 103
            readOnly: true
          pdv:
            type: integer
            description: Variation in packet delay in milliseconds
            example: 1
            readOnly: true
          errorDetail:
            type: string
            description: Error details, if an error was encountered
            example: Connection error
            readOnly: true
    TestResultAgent:
      type: object
      properties:
        agentId:
          type: string
          description: Unique agent ID
          example: '281474976710706'
          readOnly: true
        agentName:
          type: string
          description: Agent name
          example: thousandeyes-stg-va-254
          readOnly: true
        countryId:
          type: string
          description: 2-digit ISO country code
          example: US
          readOnly: true
        location:
          type: string
          description: Location of the agent.
          example: San Francisco Bay Area
          readOnly: true
    TestResultErrorDetails:
      type: string
      description: Error details, if an error were encountered
      example: Connection error
      readOnly: true
    ConsoleLogs:
      type: object
      description: Console logs captured during script execution to help troubleshoot transaction issues.
      properties:
        level:
          type: string
          description: Severity level of the log, or UNKNOWN if the log is system-generated.
          example: INFO
        timestamp:
          type: integer
          format: int64
          description: Unix epoch time, in milliseconds, when the log entry was captured.
          example: 1715880042123
        value:
          type: string
          description: Log message.
          example: 'Uncaught TypeError: Cannot read property attr of undefined'
    ConsoleLogsResult:
      allOf:
      - $ref: '#/components/schemas/TestResult'
      - type: object
        properties:
          agent:
            $ref: '#/components/schemas/TestResultAgent'
          consoleLogs:
            type: array
            items:
              $ref: '#/components/schemas/ConsoleLogs'
    ConsoleLogsTestResults:
      type: object
      readOnly: true
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ConsoleLogsResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    StartTime:
      type: integer
      description: Epoch time (seconds) indicating the start time of the round
      example: 1384309800
      readOnly: true
    EndTime:
      type: integer
      description: Epoch time (seconds) indicating the end time of the round
      example: 1384309800
      readOnly: true
    EpochTimeWindow:
      type: object
      properties:
        startTime:
          $ref: '#/components/schemas/StartTime'
        endTime:
          $ref: '#/components/schemas/EndTime'
    BgpTestResults:
      type: object
      properties:
        results:
          x-paginated-items: true
          type: array
          items:
            $ref: '#/components/schemas/BgpTestResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    BgpTestResult:
      allOf:
      - $ref: '#/components/schemas/BgpBasicTestResult'
      - $ref: '#/components/schemas/EpochTimeWindow'
      - type: object
        properties:
          updates:
            type: number
            format: double
            description: Number of updates tracked against this prefix by this monitor.
            example: 0
          pathChanges:
            type: number
            format: double
            description: Number of path changes tracked against this prefix by this monitor.
            example: 0
          reachability:
            type: number
            format: double
            description: Percentage reachability
            example: 0
    BgpBasicTestResult:
      allOf:
      - $ref: '#/components/schemas/TestResult'
      - type: object
        properties:
          monitor:
            $ref: '#/components/schemas/TestResultMonitor'
          prefixId:
            type: string
            description: Internally tracked prefix ID.
            example: '215'
          prefix:
            type: string
            description: Prefix being tracked.
            example: 99.128.0.0/11
    TestResultMonitor:
      type: object
      properties:
        monitorId:
          type: string
          description: Unique monitor ID.
          example: '281474976710706'
          readOnly: true
        monitorName:
          type: string
          description: The name of the Monitor.
          example: Vancouver, Canada - Bell Canada (AS 6539)
          readOnly: true
        countryId:
          type: string
          description: 2-digit ISO country code.
          example: US
          readOnly: true
    BgpTestRouteInformationResults:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BgpTestRouteInformationResult'
        test:
          $ref: '#/components/schemas/SimpleTest'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    BgpTestRouteInformationResult:
      allOf:
      - $ref: '#/components/schemas/BgpBasicTestResult'
      - type: object
        properties:
          isActive:
            type: boolean
            description: Represents whether the route is active or inactive. An inactive route was an active route in the
              previous test round and is now superseded by another active (preferred) route. When requesting data for the
              test round in which a route change happened, both routes (active and inactive one) are included in the response.
            example: true
          hops:
            type: array
            items:
              $ref: '#/components/schemas/BgpHop'
    BgpHop:
      type: object
      properties:
        asn:
          type: integer
          description: ASN of transit autonomous system
          readOnly: true
          example: 852
        asName:
          type: string
          description: Name of autonomous system.
          readOnly: true
          example: Telus Advanced Communications
    TestResult:
      type: object
      properties:
        date:
          type: string
          description: Data point date UTC (ISO date-time format).
          format: date-time
          example: '2022-07-17T22:00:54Z'
          readOnly: true
        roundId:
          type: integer
          description: Epoch time (seconds) indicating the start time of the round
          example: 1384309800
          readOnly: true
        _links:
          $ref: '#/components/schemas/TestResultAppLinks'
    TestResultAppLinks:
      allOf:
      - $ref: '#/components/schemas/AppLinks'
      - example:
          appLink:
            href: https://app.thousandeyes.com/view/tests?__a=105&testId=195&roundId=1692916680&agentId=125
    DnsServerMeasurement:
      type: object
      description: DNS resolution details collected while locating the HTTP test target. Present when the agent captured DNS
        server measurement data for the round. The order of `unusedDnsResponses` matches the order returned by the DNS resolver.
      readOnly: true
      properties:
        usedDnsResponse:
          $ref: '#/components/schemas/DnsServerResponse'
        unusedDnsResponses:
          type: array
          description: Additional DNS responses received while resolving the target.
          items:
            $ref: '#/components/schemas/DnsServerResponse'
          example:
          - id: 41838
            responseCode: servfail
            dnsResolver: 8.8.4.4
            question:
            - name: www.google.com
              type: aaaa
              class: in
              ttl: 0
              data: ''
        usedHostsFile:
          type: boolean
          description: Indicates whether the hosts file (for example, `/etc/hosts`) was used to resolve the target.
          example: false
          readOnly: true
        resolvedIp:
          type: string
          description: IP address resolved for the target, from DNS or the hosts file.
          example: 142.250.191.132
          readOnly: true
    DnsServerResponse:
      type: object
      description: A DNS response received while resolving the HTTP test target.
      readOnly: true
      properties:
        id:
          type: integer
          description: DNS message ID.
          example: 41837
          readOnly: true
        qr:
          $ref: '#/components/schemas/DnsQr'
        opcode:
          $ref: '#/components/schemas/DnsOpcode'
        authoritativeAnswer:
          type: boolean
          description: DNS header AA flag.
          example: false
          readOnly: true
        truncation:
          type: boolean
          description: DNS header TC flag.
          example: false
          readOnly: true
        recursionDesired:
          type: boolean
          description: DNS header RD flag.
          example: true
          readOnly: true
        recursionAvailable:
          type: boolean
          description: DNS header RA flag.
          example: true
          readOnly: true
        zero:
          type: boolean
          description: DNS header Z flag. Reserved and expected to be false.
          example: false
          readOnly: true
        authenticData:
          type: boolean
          description: DNS header AD flag.
          example: false
          readOnly: true
        checkingDisabled:
          type: boolean
          description: DNS header CD flag.
          example: false
          readOnly: true
        responseCode:
          $ref: '#/components/schemas/DnsResponseCode'
        question:
          type: array
          description: Records in the DNS question section.
          items:
            $ref: '#/components/schemas/DnsResourceRecord'
        answer:
          type: array
          description: Records in the DNS answer section.
          items:
            $ref: '#/components/schemas/DnsResourceRecord'
        dnsResolver:
          type: string
          description: DNS resolver that returned this response.
          example: 8.8.8.8
          readOnly: true
        timing:
          $ref: '#/components/schemas/DnsTiming'
        protocol:
          $ref: '#/components/schemas/DnsMeasurementProtocol'
    DnsResourceRecord:
      type: object
      description: A DNS resource record from the question or answer section.
      readOnly: true
      properties:
        name:
          type: string
          description: Record name.
          example: www.google.com
          readOnly: true
        type:
          $ref: '#/components/schemas/DnsResourceRecordType'
        class:
          $ref: '#/components/schemas/DnsResourceRecordClass'
        ttl:
          type: integer
          description: Time to live in seconds.
          example: 300
          readOnly: true
        data:
          type: string
          description: Record data (RDATA).
          example: 142.250.191.132
          readOnly: true
    DnsTiming:
      type: object
      description: Timing metrics for a DNS lookup.
      readOnly: true
      properties:
        startTimeUs:
          type: string
          description: Unix epoch timestamp in microseconds when the DNS query started.
          example: '1769706600000000'
          readOnly: true
        totalTimeUs:
          type: integer
          description: Total DNS lookup time in microseconds.
          example: 19304
          readOnly: true
    DnsQr:
      type: string
      description: DNS header QR flag.
      enum:
      - query
      - response
      example: response
      readOnly: true
    DnsOpcode:
      type: string
      description: DNS header OPCODE field (RFC 1035).
      enum:
      - query
      - iquery
      - status
      - unknown-3
      - unknown-4
      - unknown-5
      - unknown-6
      - unknown-7
      - unknown-8
      - unknown-9
      - unknown-10
      - unknown-11
      - unknown-12
      - unknown-13
      - unknown-14
      - unknown-15
      example: query
      readOnly: true
    DnsResponseCode:
      type: string
      description: DNS response code (RCODE), including extended RCODE values (RFC 1035 and RFC 6891).
      enum:
      - noerror
      - formerr
      - servfail
      - nxdomain
      - notimp
      - refused
      - yxdomain
      - yxrrset
      - nxrrset
      - notauth
      - notzone
      - unknown-11
      - unknown-12
      - unknown-13
      - unknown-14
      - unknown-15
      - badvers
      - badkey
      - badtime
      - badmode
      - badname
      - badalg
      - badtrunc
      - badcookie
      example: noerror
      readOnly: true
    DnsResourceRecordType:
      type: string
      description: DNS resource record type (IANA). Values match `DnsRecordType` on DNS Server test configuration where applicable.
      enum:
      - unknown
      - a
      - cname
      - aaaa
      example: a
      readOnly: true
    DnsResourceRecordClass:
      type: string
      description: DNS resource record class (IANA).
      enum:
      - unknown
      - in
      example: in
      readOnly: true
    DnsMeasurementProtocol:
      type: string
      description: Actual wire transport used to perform the DNS lookup. `tcp` indicates a TCP retry (for example, after a
        truncated UDP response).
      enum:
      - unspecified
      - udp
      - tcp
      - dot
      - doh
      example: udp
      readOnly: true
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type. When this member is not present, its value is assumed
            to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
    ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          errors:
            nullable: true
            type: array
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/ValidationErrorItem'
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: invalid_token
        error_description:
          type: string
          example: Invalid access token
    TestDirection:
      type: string
      enum:
      - to-target
      - from-target
      - bidirectional
      description: Direction of the test, which affects how results are shown.
      default: to-target
      example: to-target
    TestInterval:
      type: integer
      enum:
      - 60
      - 120
      - 300
      - 600
      - 900
      - 1800
      - 3600
      description: Interval between test runs in seconds.
      default: 60
      example: 60
    Enabled:
      type: boolean
      description: Test is enabled.
      example: true
      default: true
    TestCreatedBy:
      type: string
      description: User that created the test.
      example: user@user.com
      readOnly: true
    TestCreatedDate:
      type: string
      format: date-time
      description: UTC created date (ISO date-time format).
      example: '2022-07-17T22:00:54Z'
      readOnly: true
    TestType:
      type: string
      enum:
      - api
      - agent-to-agent
      - agent-to-server
      - bgp
      - http-server
      - page-load
      - web-transactions
      - ftp-server
      - dns-trace
      - dns-server
      - dnssec
      - sip-server
      - voice
      description: This is a read only value, as test type is implicit in the test creation url.
      readOnly: true
      example: agent-to-server
    Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that
            should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    TestSelfLink:
      allOf:
      - $ref: '#/components/schemas/Link'
      - description: Reference to the test.
        example:
          href: https://api.thousandeyes.com/v7/tests/{type}/281474976710706
    TestResults:
      type: array
      description: Reference to the test results.
      items:
        $ref: '#/components/schemas/Link'
      example:
      - href: https://api.thousandeyes.com/v7/test-results/281474976710706/network
      - href: https://api.thousandeyes.com/v7/test-results/281474976710706/path-vis
    TestLinks:
      type: object
      description: A list of links that can be accessed to get more information
      properties:
        self:
          $ref: '#/components/schemas/TestSelfLink'
        testResults:
          $ref: '#/components/schemas/TestResults'
      readOnly: true
    SimpleTest:
      description: Each test includes additional fields depending on its `type`. Refer `/tests/{type}` endpoint to know the
        set of fields returned by a given `type`.
      additionalProperties: true
      type: object
      properties:
        interval:
          $ref: '#/components/schemas/TestInterval'
        alertsEnabled:
          type: boolean
          description: Indicates if alerts are enabled.
          example: true
        enabled:
          $ref: '#/components/schemas/Enabled'
        createdBy:
          $ref: '#/components/schemas/TestCreatedBy'
        createdDate:
          $ref: '#/components/schemas/TestCreatedDate'
        description:
          type: string
          description: A description of the test.
          example: ThousandEyes Test
        liveShare:
          type: boolean
          description: Indicates if the test is shared with the account group.
          example: false
          readOnly: true
        modifiedBy:
          type: string
          description: User that modified the test.
          example: user@user.com
          readOnly: true
        modifiedDate:
          type: string
          format: date-time
          description: UTC last modification date (ISO date-time format).
          readOnly: true
          example: '2022-07-17T22:00:54Z'
        savedEvent:
          type: boolean
          description: 'Indicates if the test is a saved event.


            **Note**: **Saved Events** are now called **Private Snapshots** in the user interface. This change does not affect
            API.

            '
          readOnly: true
        testId:
          type: string
          description: Each test is assigned an unique ID; this is used to access test information and results from other
            endpoints.
          readOnly: true
          example: '281474976710706'
        testName:
          type: string
          description: The name of the test. Test name must be unique.
          example: ThousandEyes Test
        type:
          $ref: '#/components/schemas/TestType'
        _links:
          $ref: '#/components/schemas/TestLinks'
    StartDate:
      type: string
      format: date-time
      example: '2022-07-17T22:00:54Z'
      description: (Optional) When passing `window` or `startDate` parameter,  the client will also receive the `startDate`
        field indicating the UTC start date of the data's time range being retrieved  (ISO date-time format).
      readOnly: true
    EndDate:
      type: string
      format: date-time
      example: '2022-07-18T22:00:54Z'
      description: (Optional) When passing `window` or `endDate` parameter,  the client will also receive the `endDate` field
        indicating the UTC end date of the data's time range being retrieved  (ISO date-time format).
      readOnly: true
    PaginationLinks:
      type: object
      description: A links object containing pagination related link(s).
      properties:
        previous:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        self:
          $ref: '#/components/schemas/Link'
    SelfLinks:
      type: object
      description: A links object containing the self link.
      readOnly: true
      properties:
        self:
          $ref: '#/components/schemas/Link'
    AppLinks:
      type: object
      description: A links object containing the ThousandEyes App link
      readOnly: true
      properties:
        appLink:
          $ref: '#/components/schemas/Link'
  responses:
    '400':
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            type: about:blank
            title: Request validation failed. There are invalid or missing fields
            status: 400
            detail: Your request object contains invalid fields.
            instance: /v7
            errors:
            - code: AM-5432
              field: firstName
              message: firstName cannot have fancy characters
            - code: DASH-5622
              field: password
              message: Password cannot be blank
    '401':
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    '403':
      description: Insufficient permissions to query endpoint
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: URI Resource Not Found
            status: 404
            detail: Details explaining if the 404 error is related to an invalid URI or a wrong ID
            instance: /v7
    '429':
      description: Exhausted rate limit for the organization
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: about:blank
            title: Internal server error
            status: 500
            detail: Optional detail about the internal error message.
            instance: /v7
    '502':
      description: Bad Gateway
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    GeneralError:
      description: An error occurred
