    put:
      tags:
      - Panorama Connectors
      summary: Assign operations to Panorama connector
      description: Assigns operations to a Panorama connector. This replaces any existing assignments. Passing an empty array
        removes all operation assignments from the connector.
      operationId: setPanoramaConnectorOperations
      parameters:
      - $ref: '#/components/parameters/connectorIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      requestBody:
        description: List of operation IDs to assign to the connector.
        content:
          application/json:
            schema:
              type: array
