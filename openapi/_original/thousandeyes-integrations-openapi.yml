components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer authentication token
  schemas:
    Assignments:
      type: object
      properties:
        items:
          type: array
          items:
            type: string
            example: ca39314d-eb4f-496f-9435-b5d20b1bfbff
        _links:
          $ref: '#/components/schemas/SelfLinks'
      description: A list of assigned items.
    Header:
      required:
      - name
      - value
      type: object
      properties:
        name:
          type: string
          example: Content-Type
        value:
          type: string
          example: application/json
    OperationCategory:
      type: string
      enum:
      - alerts
      - recommendations
      - traffic-monitoring
    OperationStatus:
      type: string
      description: 'The connectivity status of the operation to its target endpoint. Indicates whether the operation can successfully
        connect and communicate with the target URL. Values: ''pending'' (initial state, not yet tested), ''connected'' (successfully
        connected), ''failing'' (connection or execution issues), ''unverified'' (not yet verified/tested).'
      enum:
      - pending
      - connected
      - failing
      - unverified
    OperationType:
      type: string
      enum:
      - webhook
    WebhookOperation:
      required:
      - category
      - name
      - status
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        name:
          type: string
          example: My operation
        enabled:
          type: boolean
          example: true
        category:
          $ref: '#/components/schemas/OperationCategory'
        status:
          $ref: '#/components/schemas/OperationStatus'
        path:
          type: string
          example: /custom/path
        payload:
          type: string
          description: Handlebars template for the payload.
          example: '{"property1": {{numericVar}}, "property2": "{{stringVar}}"}'
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        queryParams:
          type: string
          description: Handlebars template for the query params. Most compile into a proper JSON object where each object
            property will define the query param name and the object property value define the corresponding query param value.
          example: '{"queryParam1":"{{stringVar}}"}'
        type:
          $ref: '#/components/schemas/OperationType'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    CredentialVaultOperation:
      required:
      - name
      - secrets
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        name:
          type: string
          example: My operation
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/CredentialVaultSecret'
        type:
          $ref: '#/components/schemas/OperationType'
        status:
          $ref: '#/components/schemas/OperationStatus'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    CredentialVaultSecret:
      required:
      - name
      - secretKey
      type: object
      properties:
        id:
          type: string
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        name:
          type: string
          example: secret_name
        secretKey:
          type: string
          example: secret/key
    AuthenticationType:
      type: string
      enum:
      - basic
      - bearer-token
      - oauth-auth-code
      - oauth-client-credentials
      - other-token
      - conjur-host
    BasicAuthentication:
      required:
      - password
      - type
      - username
      type: object
      properties:
        username:
          type: string
          example: user1
        password:
          type: string
          example: abc123
        type:
          $ref: '#/components/schemas/AuthenticationType'
    BearerTokenAuthentication:
      required:
      - token
      - type
      type: object
      properties:
        token:
          type: string
        type:
          $ref: '#/components/schemas/AuthenticationType'
    ConnectorType:
      type: string
      enum:
      - generic
    GenericConnector:
      required:
      - name
      - target
      - type
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        type:
          $ref: '#/components/schemas/ConnectorType'
        name:
          type: string
          example: Cisco Slack
        target:
          type: string
          example: https://hooks.slack.com/services/REDACTED
        lastModifiedDate:
          type: integer
          description: The date when the connector was last modified (Unix timestamp in milliseconds).
          format: int64
          readOnly: true
          example: 1770293655756
        authentication:
          $ref: '#/components/schemas/GenericConnectorAuth'
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    GenericConnectorAuth:
      type: object
      discriminator:
        propertyName: type
        mapping:
          basic: '#/components/schemas/BasicAuthentication'
          bearer-token: '#/components/schemas/BearerTokenAuthentication'
          other-token: '#/components/schemas/OtherTokenAuthentication'
          oauth-auth-code: '#/components/schemas/OauthCodeAuthentication'
          oauth-client-credentials: '#/components/schemas/OauthClientCredentialsAuthentication'
      oneOf:
      - $ref: '#/components/schemas/BasicAuthentication'
      - $ref: '#/components/schemas/BearerTokenAuthentication'
      - $ref: '#/components/schemas/OtherTokenAuthentication'
      - $ref: '#/components/schemas/OauthCodeAuthentication'
      - $ref: '#/components/schemas/OauthClientCredentialsAuthentication'
    OauthClientCredentialsAuthentication:
      required:
      - oauthClientId
      - oauthClientSecret
      - oauthTokenUrl
      - type
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        oauthClientId:
          type: string
          example: my-client-id
        oauthTokenUrl:
          type: string
          example: https://oauth.example.com/token
        oauthClientSecret:
          type: string
          example: client-secret-xyz123
        scope:
          type: string
          example: read:data write:data
        type:
          $ref: '#/components/schemas/AuthenticationType'
    OauthCodeAuthentication:
      required:
      - code
      - oauthAuthUrl
      - oauthClientId
      - oauthClientSecret
      - oauthTokenUrl
      - redirectUri
      - type
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        refreshToken:
          type: string
          example: refresh-token-abc456
        oauthClientId:
          type: string
          example: my-client-id
        oauthAuthUrl:
          type: string
          example: https://oauth.example.com/authorize
        oauthTokenUrl:
          type: string
          example: https://oauth.example.com/token
        oauthClientSecret:
          type: string
          example: client-secret-xyz123
        code:
          type: string
          example: auth-code-def789
        redirectUri:
          type: string
          example: https://app.example.com/callback
        type:
          $ref: '#/components/schemas/AuthenticationType'
    OtherTokenAuthentication:
      required:
      - token
      - type
      type: object
      properties:
        token:
          type: string
          example: custom-token-abc123xyz
        type:
          $ref: '#/components/schemas/AuthenticationType'
    ConjurConnector:
      required:
      - account
      - authentication
      - name
      - target
      - type
      type: object
      properties:
        id:
          type: string
          readOnly: true
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        type:
          $ref: '#/components/schemas/ConnectorType'
        name:
          type: string
          example: Cisco Slack
        target:
          type: string
          example: https://eval.conjur.org/secrets
        lastModifiedDate:
          type: integer
          description: The date when the connector was last modified (Unix timestamp in milliseconds).
          format: int64
          readOnly: true
          example: 1770293655756
        account:
          type: string
          example: My CyberArk Account
        authentication:
          $ref: '#/components/schemas/ConjurHostAuthentication'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    ConjurHostAuthentication:
      required:
      - apiKey
      - hostId
      - type
      type: object
      properties:
        hostId:
          type: string
          example: host1
        apiKey:
          type: string
          example: abc123
        type:
          $ref: '#/components/schemas/AuthenticationType'
    PanoramaConnector:
      description: Palo Alto Networks Panorama connector configuration.
      required:
      - authentication
      - name
      - target
      - type
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the Panorama connector.
          readOnly: true
          example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
        type:
          type: string
          description: Connector type.
          enum:
          - panorama
          example: panorama
        name:
          type: string
          description: Name of the Panorama connector.
          example: Branch Panorama
        target:
          type: string
          description: URL of the Panorama instance.
          example: https://panorama.example.com
        lastModifiedDate:
          type: integer
          description: Time when the connector was last modified, in milliseconds since the Unix epoch.
          format: int64
          readOnly: true
          example: 1770293655756
        authentication:
          $ref: '#/components/schemas/PanoramaConnectorAuth'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    PanoramaConnectorAuth:
      type: object
      description: Authentication configuration for the Panorama connector.
      discriminator:
        propertyName: type
        mapping:
          other-token: '#/components/schemas/PanoramaTokenAuthentication'
          pan-key-gen: '#/components/schemas/PanoramaKeyGenAuthentication'
      oneOf:
      - $ref: '#/components/schemas/PanoramaTokenAuthentication'
      - $ref: '#/components/schemas/PanoramaKeyGenAuthentication'
    PanoramaTokenAuthentication:
      required:
      - token
      - type
      type: object
      description: Authentication using an existing Panorama API key.
      properties:
        token:
          type: string
          description: Panorama API key used for authentication.
          writeOnly: true
        type:
          type: string
          description: Authentication type.
          enum:
          - other-token
    PanoramaKeyGenAuthentication:
      required:
      - keyTtl
      - password
      - type
      - username
      type: object
      description: Authentication using credentials to generate a Panorama API key.
      properties:
        username:
          type: string
          description: Username used to generate the Panorama API key.
          example: panorama-user
        password:
          type: string
          description: Password used to generate the Panorama API key.
          format: password
          writeOnly: true
        keyTtl:
          type: integer
          description: Time to live for the generated Panorama API key, in minutes.
          format: int64
          minimum: 30
          example: 40
        type:
          type: string
          enum:
          - pan-key-gen
    WebhookOperations:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookOperation'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    CredentialVaultOperations:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialVaultOperation'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    GenericConnectors:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GenericConnector'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    ConjurConnectors:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConjurConnector'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    PanoramaConnectors:
      type: object
      description: Collection of Panorama connectors.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PanoramaConnector'
        _links:
          $ref: '#/components/schemas/SelfLinks'
    Error:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type. When this member is not present, its value is assumed
            to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
    ValidationErrorItem:
      type: object
      properties:
        code:
          type: string
          description: (Optional) A unique error type/code that can be referenced in the documentation for further details.
        field:
          type: string
          description: Identifies the field that triggered this particular error.
        message:
          type: string
          description: A short, human-readable summary of the error.
    ValidationError:
      type: object
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          errors:
            nullable: true
            type: array
            description: (Optional) When multiple errors occur, the details for each error are listed.
            items:
              $ref: '#/components/schemas/ValidationErrorItem'
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: invalid_token
        error_description:
          type: string
          example: Invalid access token
    Link:
      type: object
      description: A hyperlink from the containing resource to a URI.
      required:
      - href
      properties:
        href:
          type: string
          description: Its value is either a URI [RFC3986] or a URI template [RFC6570].
          example: https://api.thousandeyes.com/v7/link/to/resource/id
        templated:
          type: boolean
          description: Should be true when the link object's "href" property is a URI template.
        type:
          type: string
          description: Used as a hint to indicate the media type expected when dereferencing the target resource.
        deprecation:
          type: string
          description: Its presence indicates that the link is to be deprecated at a future date. Its value is a URL that
            should provide further information about the deprecation.
        name:
          type: string
          description: Its value may be used as a secondary key for selecting link objects that share the same relation type.
        profile:
          type: string
          description: A URI that hints about the profile of the target resource.
        title:
          type: string
          description: Intended for labelling the link with a human-readable identifier
        hreflang:
          type: string
          description: Indicates the language of the target resource
    SelfLinks:
      type: object
      description: A links object containing the self link.
      readOnly: true
      properties:
        self:
          $ref: '#/components/schemas/Link'
  parameters:
    operationIdPath:
      name: id
      in: path
      description: The operation ID.
      required: true
      schema:
        type: string
      example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
    connectorIdPath:
      name: id
      in: path
      description: The connector ID.
      required: true
      schema:
        type: string
      example: cb1b8033-ea2d-4e9b-a920-fe87850693cf
    AccountGroupId:
      name: aid
      in: query
      description: A unique identifier associated with your account group. You can retrieve your `AccountGroupId` from the
