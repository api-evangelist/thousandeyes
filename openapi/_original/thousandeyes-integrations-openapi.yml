openapi: 3.0.1
security:
- BearerAuth: []
info:
  title: Integrations API
  description: '**Note:** The Webhook Operations APIs are not available for ThousandEyes for Government instance.


    Manage connectors and operations.

    '
  version: 7.0.100
  x-provenance:
    method: harvested
    authored_by: Cisco ThousandEyes
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 27 OpenAPI 3.0 documents (26 per-area plus a unified 326-operation document) served anonymously from Cisco's DevNet
      CDN. api.thousandeyes.com itself 401s every path, so the contract is public while the API host is gated.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/000-v7-apis/docs/reference/
  - type: source
    url: https://developer.cisco.com/docs/thousandeyes/
servers:
- url: https://api.thousandeyes.com/v7
  description: ThousandEyes API v7
tags:
- name: Credential Vault Operations
  description: Credential Vault operations allow you to configure vault secrets.
- name: Operation Connectors
  description: Manage the connectors assigned to an operation.
- name: CyberArk Conjur Connectors
  description: The CyberArk Conjur instance you want the ThousandEyes platform to integrate with.
- name: Webhook Operations
  description: Webhook operations allow you to customize the payload of generic connectors.
- name: Generic Connectors
  description: A generic connector represents an instance of a third-party service that you can integrate with the ThousandEyes
    platform.
- name: Panorama Connectors
  description: A Panorama connector represents an instance of Palo Alto Networks Panorama that you can integrate with the
    ThousandEyes platform.
paths:
  /operations/{type}/{id}/connectors:
    get:
      tags:
      - Operation Connectors
      summary: Retrieve connectors assigned to an operation
      description: Returns a list of connectors assigned to a specific operation.
      operationId: getOperationConnectors
      parameters:
      - name: type
        in: path
        description: The operation type.
        required: true
        schema:
          type: string
        example: webhooks
      - $ref: '#/components/parameters/operationIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      responses:
        '200':
          description: A list of assigned connectors.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Assignments'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
      - Operation Connectors
      summary: Assign connectors to an operation
      description: 'Assigns one or more connectors to an operation. This replaces any existing assignments. Note: This operation
        may disable affected objects (such as tests) if connectors are changed.'
      operationId: setOperationConnectors
      parameters:
      - name: type
        in: path
        description: The operation type.
        required: true
        schema:
          type: string
        example: webhooks
      - $ref: '#/components/parameters/operationIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - name: confirmDisabledObjects
        in: query
        description: Confirmation to disable affected objects (for example, tests) for credential-vault operations.
        required: false
        schema:
          type: boolean
          default: false
        example: true
      - $ref: '#/components/parameters/AccountGroupId'
      requestBody:
        description: List of connector IDs to assign to the operation.
        content:
          application/json:
            schema:
              maxItems: 1
              minItems: 0
              type: array
              items:
                type: string
            example:
            - ca39314d-eb4f-496f-9435-b5d20b1bfbff
        required: true
      responses:
        '200':
          description: Operation Connectors updated successfully.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Assignments'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /operations/webhooks/{id}:
    get:
      tags:
      - Webhook Operations
      summary: Retrieve webhook operation
      description: Retrieves details of a webhook operation by its ID.
      operationId: getWebhookOperation
      parameters:
      - $ref: '#/components/parameters/operationIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      responses:
        '200':
          description: Webhook operation with the given id.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/WebhookOperation'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
      - Webhook Operations
      summary: Update webhook operation
      description: Updates the webhook operation specified by ID.
      operationId: updateWebhookOperation
      parameters:
      - $ref: '#/components/parameters/operationIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookOperation'
        required: true
      responses:
        '200':
          description: The updated webhook operation.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/WebhookOperation'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Webhook Operations
      summary: Delete webhook operation
      description: Deletes the webhook operation specified by ID.
      operationId: deleteWebhookOperation
      parameters:
      - $ref: '#/components/parameters/operationIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      responses:
        '204':
          description: No Content.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
