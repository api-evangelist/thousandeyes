        '500':
          $ref: '#/components/responses/500'
    put:
      tags:
      - Panorama Connectors
      summary: Update Panorama connector
      description: Replaces the Panorama connector specified by ID. The request must include the complete connector configuration,
        including authentication credentials; existing credentials are not retained when authentication is omitted.
      operationId: updatePanoramaConnector
      parameters:
      - $ref: '#/components/parameters/connectorIdPath'
        name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/AccountGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanoramaConnector'
            example:
              type: panorama
              name: Branch Panorama
              target: https://panorama.example.com
              authentication:
                username: panorama-user
                password: <panorama-password>
                keyTtl: 40
                type: pan-key-gen
        required: true
      responses:
        '200':
          description: The updated Panorama connector.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/PanoramaConnector'
        '400':
