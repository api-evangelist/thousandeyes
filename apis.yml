  description: 'You can create and execute a new endpoint instant scheduled test within ThousandEyes using this
    API. The test parameters are specified in the `POST` data. The following applies to the Endpoint Instant Scheduled
    Tests API: * To initiate the creation and execution of an instant scheduled test, the user must possess the
    `Edit endpoint tests` permission. * Upon successful creation of an instant scheduled test, the API responds
    with an HTTP/201 CREATED status code and return the test definition. * It''s important to note that the response
