aid: thousandeyes
name: ThousandEyes
description: ThousandEyes is Cisco's digital experience monitoring platform, acquired in 2020 and operated as part
  of Cisco Networking. It runs a global fleet of Cloud, Enterprise, Endpoint and Connected Device agents that measure
  network paths, BGP routing, DNS, application response and internet outages end to end, then exposes that telemetry
  through the ThousandEyes v7 REST API. The v7 API is documented on Cisco DevNet and publishes 26 downloadable OpenAPI
  3.0 documents plus a unified document covering 326 operations across tests, instant tests, test results, agents,
  endpoint agents, alerts, event detection, dashboards, tags, templates, integrations, credentials, Internet Insights,
  Cloud Insights, usage and administration. Authentication is a bearer API token, with an OAuth 2.0 authorization-code
  and device-code flow advertised anonymously at /.well-known/oauth-authorization-server. Cisco also runs a remote
  MCP server at https://api.thousandeyes.com/mcp with about 51 documented tools, generated SDKs for Python, Java
  and Go, a Go CLI, a Terraform provider, a public Postman collection and a ThousandEyes for Government FedRAMP
  Moderate instance.
url: https://raw.githubusercontent.com/api-evangelist/thousandeyes/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
