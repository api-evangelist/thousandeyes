- aid: thousandeyes:thousandeyes-event-detection-api
  name: ThousandEyes Event Detection API
  description: Event detection occurs when ThousandEyes identifies that error signals related to a component (proxy,
    network node, AS, server etc) have deviated from the baselines established by events. * To determine this, ThousandEyes
    takes the test results from all accounts groups within an organization, and analyzes that data. * Noisy test
    results (those that have too many errors in a short window) are removed until they stabilize, and the rest of
    the results are tagged with the components associated with that test result (for example, proxy, network, or
    server). * Next, any increase in failures from the test results and each component helps in determining the
    problem domain and which component may be at fault. * When this failure rate increases beyond a pre-defined
    threshold (set by the algorithm), an event is triggered and an email notification is sent to the user (if they've
    enabled email...
  humanURL: https://developer.cisco.com/docs/thousandeyes/event-detection-api-overview/
  baseURL: https://api.thousandeyes.com/v7
  tags:
  - Events
  properties:
  - type: OpenAPI
    url: openapi/thousandeyes-event-detection-openapi.yml
  - type: Overlay
    url: overlays/thousandeyes-event-detection-overlay.yaml
  - type: APIReference
