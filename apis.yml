- aid: thousandeyes:thousandeyes-administrative-api
  name: ThousandEyes Administrative API
  description: 'Manage users, accounts, and account groups in the ThousandEyes platform using the Administrative
    API. This API provides the following operations to manage your organization: * `/account-groups`: Account groups
    are used to divide an organization into different sections. These operations can be used to create, retrieve,
    update and delete account groups. * `/users`: Create, retrieve, update and delete users within an organization.
    * `/roles`: Create, retrieve and update roles for the current user. * `/permissions`: Retrieve all assignable
    permissions. Used in the context of modifying roles. * `/audit-user-events`: Retrieve all activity log events.
    For more information about the administrative models, see Account Management.'
