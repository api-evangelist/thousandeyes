x-contract-note: 27 OpenAPI 3.0 documents (326 operations) served anonymously from Cisco's DevNet CDN at pubhub.devnetcloud.com.
  The API host itself (api.thousandeyes.com) 401s every path, so the contract is public while the API is gated —
  the initial 'gated' reading checked the API host, not the docs CDN.
