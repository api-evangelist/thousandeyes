idempotency:
  supported: false
  evidence: No Idempotency-Key (or equivalent) header appears in any of the 26 harvested OpenAPI documents,
    and the developer reference documents no retry-safety mechanism for POST. Creates are not replay-safe;
    a retried create makes a second object.
  note: Recorded as an honest absence. No Idempotency pointer is emitted in apis.yml.
pagination:
  style: cursor
  link_style: HAL-ish _links envelope
  request_param: cursor
  response_fields:
  - _links.self.href
  - _links.next.href
  semantics: Follow _links.next.href until it is absent. Page size is server-decided and varies with test
    type and agent count.
  docs: https://developer.cisco.com/docs/thousandeyes/pagination/
time_ranges:
  params:
  - window
  - startDate
  - endDate
  window_format: relative duration such as 10d, 2h, 30m
  absolute_format: ISO 8601 UTC; startDate and endDate are used together and are mutually exclusive with
    window
  docs: https://developer.cisco.com/docs/thousandeyes/time-ranges/
tenancy:
  param: aid
  in: query
  meaning: account group id; defaults to the login account group
  docs: https://developer.cisco.com/docs/thousandeyes/account-group-context/
field_expansion:
  param: expand
  in: query
  meaning: inline related sub-resources on read operations (e.g. expand=agent on a test)
  evidence: Tests_API_ExpandTest, Test_Results_API_HttpServerExpand and 20+ sibling parameters in components.parameters
content_negotiation:
  response_format: JSON only — responses are JSON regardless of request headers
  error_format: application/problem+json
