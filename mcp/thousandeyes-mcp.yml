generated: '2026-08-19'
method: searched
status: published
source: https://docs.thousandeyes.com/product-documentation/integration-guides/thousandeyes-mcp-server
deployment:
  mode: remote
  endpoint: https://api.thousandeyes.com/mcp
  auth: oauth
  verified: probed
  note: 'POST tools/list to https://api.thousandeyes.com/mcp returns HTTP 401 "Not Authorized" — the endpoint
    is live and the tool schemas are credential-gated. Anonymous discovery works via RFC 9728: /.well-known/oauth-protected-resource
    names api.thousandeyes.com as the authorization server and mcp:manage as the scope. A local-stdio
    option exists only as the generic mcp-remote@latest bridge that the docs show for AWS Kiro; ThousandEyes
    publishes no stdio package of its own, so the mode is remote.'
server:
  name: ThousandEyes MCP Server
  transport: http
  url: https://api.thousandeyes.com/mcp
  vendor_repo: https://github.com/CiscoDevNet/ThousandEyes-MCP-Server-official
  terms: https://www.thousandeyes.com/pdf/cisco-networking-mcp-server-terms.pdf
  clients_documented:
  - OpenAI Codex
  - Claude (custom connector)
  - Cursor IDE
  - VS Code
  - AWS Kiro
authentication:
  methods:
  - ThousandEyes API bearer token (Authorization header)
  - OAuth 2.0 authorization code + device code flow
  permission_required: API Access
  scopes:
  - mcp:manage
  - offline_access
  authorization_server: https://api.thousandeyes.com
rate_limits:
  bearer_token: counts against the organization-wide limit of 240 requests/minute, shared with other API
    integrations
  oauth2_client: each OAuth2 client gets its own 240 requests/minute limit that does not consume the organization
    limit
  source: https://docs.thousandeyes.com/product-documentation/integration-guides/thousandeyes-mcp-server
tool_groups:
- read-only
- write/delete
tool_count: 51
tools_source: published tool table in the ThousandEyes MCP Server integration guide; input schemas are
  NOT public — tools/list requires an authenticated session
